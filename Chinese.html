<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lesson - Papa Big Chin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .phrase-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        label {
            font-weight: bold;
            color: #34495e;
            width: 25px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media(min-width: 480px) {
            .button-grid {
                grid-template-columns: 1fr 1fr;
            }
            .back-btn {
                grid-column: span 2;
            }
        }
        .nav-btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
        }
        .primary-btn {
            background-color: #2ecc71;
            color: white;
        }
        .primary-btn:hover {
            background-color: #27ae60;
        }
        .back-btn {
            background-color: #95a5a6;
            color: white;
        }
        .back-btn:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chinese Menu</h1>
        <p class="subtitle">Customize your 5 practice phrases below, then choose an activity!</p>
        
        <div class="input-group">
            <div class="phrase-row">
                <label>1:</label>
                <input type="text" id="phrase1" value="你好吗？">
            </div>
            <div class="phrase-row">
                <label>2:</label>
                <input type="text" id="phrase2" value="谢谢你。">
            </div>
            <div class="phrase-row">
                <label>3:</label>
                <input type="text" id="phrase3" value="我喜欢学习。">
            </div>
            <div class="phrase-row">
                <label>4:</label>
                <input type="text" id="phrase4" value="今天天气很好。">
            </div>
            <div class="phrase-row">
                <label>5:</label>
                <input type="text" id="phrase5" value="再见。">
            </div>
        </div>

        <div class="button-grid">
            <button onclick="navigateTo('listen-repeat.html')" class="nav-btn primary-btn">Listen and Repeat</button>
            <button onclick="navigateTo('rearrange.html')" class="nav-btn primary-btn">Rearrange</button>
            <button onclick="navigateTo('mix-match.html')" class="nav-btn primary-btn">Mix and Match</button>
            <button onclick="navigateTo('index.html')" class="nav-btn back-btn">Back to Main Menu</button>
        </div>
    </div>

    <script>
        // NEW FEATURE: Load saved phrases immediately when the user lands on the page
        window.addEventListener('DOMContentLoaded', () => {
            const savedPhrases = JSON.parse(localStorage.getItem('chinesePhrases'));
            
            // If the user has edited phrases before, inject them back into the text boxes
            if (savedPhrases && savedPhrases.length === 5) {
                document.getElementById('phrase1').value = savedPhrases[0];
                document.getElementById('phrase2').value = savedPhrases[1];
                document.getElementById('phrase3').value = savedPhrases[2];
                document.getElementById('phrase4').value = savedPhrases[3];
                document.getElementById('phrase5').value = savedPhrases[4];
            }
        });

        function navigateTo(targetPage) {
            const phrases = [
                document.getElementById('phrase1').value,
                document.getElementById('phrase2').value,
                document.getElementById('phrase3').value,
                document.getElementById('phrase4').value,
                document.getElementById('phrase5').value
            ];

            localStorage.setItem('chinesePhrases', JSON.stringify(phrases));
            window.location.href = targetPage;
        }
    </script>

</body>
</html>
