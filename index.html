<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa Big Chin Virtual Lessons</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .lesson-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lesson-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        .lesson-btn:active {
            transform: translateY(0);
        }
                /* Full-screen Blocker Overlay Design */
        .orientation-blocker {
            display: none; /* Hidden by default on desktops and larger screens */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            z-index: 99999; /* Forces the blocker to sit on top of everything else */
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .blocker-content {
            max-width: 400px;
        }
        .blocker-icon {
            font-size: 3.5rem;
            display: inline-block;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }
        .orientation-blocker h2 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
        }
        .orientation-blocker p {
            margin: 0;
            color: #bdc3c7;
            font-size: 1rem;
            line-height: 1.4;
        }
        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* 
           RESPONSIVE VIEWPORT TRIGGER: 
           Activates ONLY on screens narrower than 768px (phones) AND when held vertically (portrait).
        */
        @media screen and (max-width: 767px) and (orientation: portrait) {
            .orientation-blocker {
                display: flex; /* Overrides hidden state and forces full-screen flex layout overlay */
            }
            body {
                overflow: hidden; /* Lock background scrolling while the blocker is active */
            }
        }

    </style>
</head>
<body>
<!-- Screen Lock Blocker Overlay for Mobile Portrait Orientation -->
<div class="orientation-blocker">
    <div class="blocker-content">
        <span class="blocker-icon">🔄</span>
        <h2>Please Rotate Your Device</h2>
        <p>This activity is best experienced in Landscape Mode. Please turn your phone sideways to unlock the lesson!</p>
    </div>
</div>

    <div class="container">
        <h1>Papa Big Chin Virtual Lessons</h1>
        
        <div class="button-grid">
            <!-- These buttons will look for files named chinese.html, science.html, etc. in the same folder -->
            <!-- Active Chinese lesson track link -->
            <a href="chinese.html" class="lesson-btn">Chinese</a>
            
            <!-- Temporarily Disabled Subject Tracks -->
            <a href="#" class="lesson-btn disabled-btn">Bahasa Melayu</a>
            <a href="#" class="lesson-btn disabled-btn">Maths</a>
            <a href="#" class="lesson-btn disabled-btn">Science</a>
        </div>
    </div>

</body>
</html>
