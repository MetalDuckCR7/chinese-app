<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Chinese Study App</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background: #fafafa; }
        .card { background: white; padding: 25px; border-radius: 16px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { font-weight: bold; border: none; cursor: pointer; }
        .btn-listen { background: #4caf50; color: white; }
        .btn-record { background: #f44336; color: white; }
        .btn-record.recording { background: #ff9800; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #eee; text-align: left; }
        .matched { color: #2e7d32; font-weight: bold; font-size: 24px; }
        .mismatched { color: #c62828; font-weight: bold; font-size: 24px; text-decoration: line-through; }
    </style>
</head>
<body>

<div class="card">
    <h2>🇨🇳 Free Chinese Practice</h2>
    <p>Type a phrase, listen, and repeat!</p>
    
    <input type="text" id="targetText" placeholder="Enter Chinese phrase (e.g. 老师好)">
    
    <button class="btn-listen" id="listenBtn">🔊 1. Listen to Teacher</button>
    <button class="btn-record" id="recordBtn">🎙️ 2. Press & Speak</button>
    
    <div id="status" style="margin: 10px 0; color: #666;">Status: Ready</div>
    
    <div class="result-box" id="resultDiv" style="display: none;">
        <h3>What the app heard:</h3>
        <div id="visualFeedback"></div>
        <p id="accuracyResult" style="font-weight: bold; margin-top: 10px;"></p>
    </div>
</div>

<script>
    const targetTextInput = document.getElementById('targetText');
    const listenBtn = document.getElementById('listenBtn');
    const recordBtn = document.getElementById('recordBtn');
    const statusText = document.getElementById('status');
    const resultDiv = document.getElementById('resultDiv');
    const visualFeedback = document.getElementById('visualFeedback');
    const accuracyResult = document.getElementById('accuracyResult');

    // 1. Text-to-Speech (Play audio)
    listenBtn.addEventListener('click', () => {
        const text = targetTextInput.value.trim();
        if (!text) return alert("Please enter a Chinese phrase first!");
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN'; // Set voice to Mandarin Chinese
        window.speechSynthesis.speak(utterance);
    });

    // 2. Speech Recognition (No API Key Required)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Your browser does not support free speech recognition. Please use Google Chrome.");
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN'; // Listen for Mandarin
        recognition.interimResults = false;

        let isRecording = false;

        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                const text = targetTextInput.value.trim();
                if (!text) return alert("Please enter the target phrase first!");
                
                recognition.start();
                isRecording = true;
                recordBtn.innerText = "🛑 Recording... Speak Now";
                recordBtn.classList.add('recording');
                statusText.innerText = "Listening to your pronunciation...";
            } else {
                recognition.stop();
            }
        });

        recognition.onresult = (event) => {
            const resultText = event.results[0][0].transcript;
            analyzeSpeech(resultText);
        };

        recognition.onend = () => {
            isRecording = false;
            recordBtn.innerText = "🎙️ 2. Press & Speak";
            recordBtn.classList.remove('recording');
            statusText.innerText = "Analysis done.";
        };

        function analyzeSpeech(heardText) {
            const targetText = targetTextInput.value.trim();
            visualFeedback.innerHTML = "";
            resultDiv.style.display = "block";

            let correctCount = 0;
            
            // Compare character by character
            for (let i = 0; i < targetText.length; i++) {
                const span = document.createElement('span');
                if (heardText[i] === targetText[i]) {
                    span.innerText = targetText[i] + " ";
                    span.className = "matched";
                    correctCount++;
                } else {
                    span.innerText = (heardText[i] || "❓") + " ";
                    span.className = "mismatched";
                }
                visualFeedback.appendChild(span);
            }

            const percentage = Math.round((correctCount / targetText.length) * 100);
            accuracyResult.innerText = `Match Score: ${percentage}% (${correctCount} of ${targetText.length} characters correct)`;
        }
    }
</script>
</body>
</html>
