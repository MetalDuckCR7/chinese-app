<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Chinese Study App</title>
    <!-- Free external engine to convert Chinese characters to Pinyin automatically -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background: #fafafa; color: #333; }
        .card { background: white; padding: 25px; border-radius: 16px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* Larger font size and padding for the main Chinese input box */
        input[type="text"] { width: 100%; padding: 18px; margin: 8px 0; border-radius: 8px; box-sizing: border-box; font-size: 26px; text-align: center; font-weight: bold; }
        
        button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-listen { background: #4caf50; color: white; }
        .btn-record { background: #f44336; color: white; }
        .btn-record.recording { background: #ff9800; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: #eee; text-align: left; }
        .toggle-container, .slider-container { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
        .slider-container { flex-direction: column; align-items: flex-start; gap: 5px; }
        .slider-row { display: flex; width: 100%; align-items: center; gap: 10px; }
        input[type="range"] { flex-grow: 1; cursor: pointer; }
        
        /* Layout for display text with Pinyin subtitles above it */
        .char-pair { display: inline-flex; flex-direction: column; align-items: center; margin: 0 4px; min-width: 30px; }
        .pinyin-sub { font-size: 14px; color: #666; height: 20px; font-weight: normal; }
        .chinese-char { font-size: 28px; font-weight: bold; }
        
        /* Result Colors */
        .matched .chinese-char { color: #2e7d32; }
        .mismatched .chinese-char { color: #c62828; text-decoration: line-through; }
        
        /* Hide class based on switch selection */
        .hide-pinyin .pinyin-sub { visibility: hidden; }
    </style>
</head>
<body>

<div class="card">
    <h2>🇨🇳 Free Chinese Practice</h2>
    <p>Type a phrase, listen, and repeat!</p>
    
    <input type="text" id="targetText" placeholder="输入中文 (e.g. 老师好)">
    
    <!-- Speaking Speed Slider -->
    <div class="slider-container">
        <label for="speedSlider" style="font-weight: bold;">Teacher's Voice Speed:</label>
        <div class="slider-row">
            <input type="range" id="speedSlider" min="0.5" max="1.0" step="0.1" value="1.0">
            <span id="speedLabel" style="font-weight: bold; min-width: 70px; text-align: right;">Normal</span>
        </div>
    </div>
    
    <div class="toggle-container">
        <label for="pinyinToggle" style="font-weight: bold; cursor: pointer;">Show Pinyin Subtitles</label>
        <input type="checkbox" id="pinyinToggle" checked style="width: auto; margin: 0; transform: scale(1.3); cursor: pointer;">
    </div>

    <button class="btn-listen" id="listenBtn">🔊 1. Listen to Teacher</button>
    <button class="btn-record" id="recordBtn">🎙️ 2. Press & Speak</button>
    
    <div id="status" style="margin: 10px 0; color: #666;">Status: Ready</div>
    
    <!-- Analysis Results -->
    <div class="result-box" id="resultDiv" style="display: none;">
        <h3>What the app heard:</h3>
        <div id="visualFeedback"></div>
        <p id="accuracyResult" style="font-weight: bold; margin-top: 15px;"></p>
    </div>
</div>

<script>
    const targetTextInput = document.getElementById('targetText');
    const listenBtn = document.getElementById('listenBtn');
    const recordBtn = document.getElementById('recordBtn');
    const pinyinToggle = document.getElementById('pinyinToggle');
    const speedSlider = document.getElementById('speedSlider');
    const speedLabel = document.getElementById('speedLabel');
    const statusText = document.getElementById('status');
    const resultDiv = document.getElementById('resultDiv');
    const visualFeedback = document.getElementById('visualFeedback');
    const accuracyResult = document.getElementById('accuracyResult');

    // Update speed label text when user moves slider
    speedSlider.addEventListener('input', () => {
        const val = parseFloat(speedSlider.value);
        if (val === 1.0) speedLabel.innerText = "Normal";
        else if (val === 0.9) speedLabel.innerText = "Slower 10%";
        else if (val === 0.8) speedLabel.innerText = "Slower 20%";
        else if (val === 0.7) speedLabel.innerText = "Slower 30%" ;
        else if (val === 0.6) speedLabel.innerText = "Slower 40%";
        else if (val === 0.5) speedLabel.innerText = "Slower 50%";
    });

    // Toggle Pinyin viewing layout selection
    pinyinToggle.addEventListener('change', () => {
        if (pinyinToggle.checked) {
            visualFeedback.classList.remove('hide-pinyin');
        } else {
            visualFeedback.classList.add('hide-pinyin');
        }
    });

    // 1. Text-to-Speech (Audio Engine)
    listenBtn.addEventListener('click', () => {
        const text = targetTextInput.value.trim();
        if (!text) return alert("Please enter a Chinese phrase first!");
        
        // Stop any current speech before playing the next
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN'; 
        
        // Set voice playback speed directly from slider scale values
        utterance.rate = parseFloat(speedSlider.value);
        
        window.speechSynthesis.speak(utterance);
    });

    // 2. Free Speech Recognition Engine
    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    if (!SpeechRecognition) {
        alert("Your tablet browser does not fully support free voice detection. Please make sure you are using official Google Chrome.");
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.interimResults = false;
        let isRecording = false;

        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                const text = targetTextInput.value.trim();
                if (!text) return alert("Please enter the target phrase first!");
                
                recognition.start();
                isRecording = true;
                recordBtn.innerText = "🛑 Recording... Speak Now";
                recordBtn.classList.add('recording');
                statusText.innerText = "Listening closely to your pronunciation...";
            } else {
                recognition.stop();
            }
        });

        recognition.onresult = (event) => {
            const resultText = event.results.transcript;
            analyzeSpeech(resultText);
        };

        recognition.onend = () => {
            isRecording = false;
            recordBtn.innerText = "🎙️ 2. Press & Speak";
            recordBtn.classList.remove('recording');
            statusText.innerText = "Analysis done.";
        };

        function analyzeSpeech(heardText) {
            const targetText = targetTextInput.value.trim();
            visualFeedback.innerHTML = "";
            resultDiv.style.display = "block";

            // Maintain toggle choice setting during recalculation
            if (!pinyinToggle.checked) visualFeedback.classList.add('hide-pinyin');
            else visualFeedback.classList.remove('hide-pinyin');

            let correctCount = 0;
            
            // Fixed Global Module Function Calls
            const targetPinyinArray = pinyinPro(targetText, { type: 'array' }) || [];
            const heardPinyinArray = pinyinPro(heardText, { type: 'array' }) || [];

            for (let i = 0; i < targetText.length; i++) {
                const pairDiv = document.createElement('div');
                pairDiv.className = "char-pair";

                const pinyinSub = document.createElement('span');
                pinyinSub.className = "pinyin-sub";
                
                const charSpan = document.createElement('span');
                charSpan.className = "chinese-char";

                // Check character match or close Pinyin matches if characters diverge but phonetics match
                if (heardText[i] === targetText[i] || (targetPinyinArray[i] && targetPinyinArray[i] === heardPinyinArray[i])) {
                    pinyinSub.innerText = targetPinyinArray[i] || "";
                    charSpan.innerText = targetText[i];
                    pairDiv.className += " matched";
                    correctCount++;
                } else {
                    // Show target Pinyin so they know how it should sound, but mark text red/strikeout
                    pinyinSub.innerText = targetPinyinArray[i] || "";
                    charSpan.innerText = heardText[i] || "❓";
                    pairDiv.className += " mismatched";
                }

                pairDiv.appendChild(pinyinSub);
                pairDiv.appendChild(charSpan);
                visualFeedback.appendChild(pairDiv);
            }

            const percentage = Math.round((correctCount / targetText.length) * 100);
            accuracyResult.innerText = `Match Score: ${percentage}% (${correctCount} of ${targetText.length} correct)`;
        }
    }
</script>
</body>
</html>
