<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa Big Chin Virtual Lessons</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .lesson-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lesson-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        .lesson-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Papa Big Chin Virtual Lessons</h1>
        
        <div class="button-grid">
            <!-- These buttons will look for files named chinese.html, science.html, etc. in the same folder -->
            <a href="chinese.html" class="lesson-btn">Chinese</a>
 <!-- This is a single-line comment           <a href="bahasa-melayu.html" class="lesson-btn">Bahasa Melayu</a>
            <a href="maths.html" class="lesson-btn">Maths</a>
            <a href="science.html" class="lesson-btn">Science</a>
--> 
        </div>
    </div>

</body>
</html>
