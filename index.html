<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa Big Chin Free Chinese Practise</title>
    <!-- Free external engine to convert Chinese characters to Pinyin automatically -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; text-align: center; background: #fafafa; color: #333; }
        .card { background: white; padding: 25px; border-radius: 16px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* High-contrast visible input box text fields styling rules */
        input[type="text"] { width: 100%; padding: 16px; margin: 8px 0; border-radius: 8px; box-sizing: border-box; font-size: 26px; text-align: center; font-weight: bold; border: 2px solid #007bff; color: #333; background: #ffffff; }
        
        button { width: 100%; padding: 14px; margin: 6px 0; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-listen { background: #4caf50; color: white; }
        .btn-record { background: #f44336; color: white; }
        .btn-record.recording { background: #ff9800; }
        
        /* Downsized Flash Cards Navigation Button realigned to Bottom Right */
        .btn-next { background: #673ab7; color: white; margin-top: 15px; width: auto; min-width: 150px; float: right; padding: 10px 16px; font-size: 14px; border-radius: 6px; }
        .button-row { display: block; width: 100%; overflow: hidden; margin-top: 5px; }
        
        /* Layout formatting systems for the live Pinyin text response tracking containers */
        .preview-box { background: #f0f7ff; text-align: center; min-height: 55px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; margin: 8px 0 15px 0; padding: 10px; border-radius: 8px; border: 1px solid #d0e3ff; }
        .result-box { margin-top: 15px; padding: 12px; border-radius: 8px; background: #eee; text-align: left; }
        .result-box h3 { margin: 0 0 8px 0; font-size: 16px; }
        .result-box p { margin: 8px 0 0 0; font-size: 15px; }
        
        .toggle-container, .slider-container { margin: 12px 0; display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
        .slider-container { flex-direction: column; align-items: flex-start; gap: 3px; }
        .slider-row { display: flex; width: 100%; align-items: center; gap: 10px; }
        input[type="range"] { flex-grow: 1; cursor: pointer; }
        
        /* Vertical structural alignment nodes to display the blue characters cleanly */
        .char-column { display: inline-flex; flex-direction: column; align-items: center; margin: 4px 10px; min-width: 50px; text-align: center; }
        
        /* Upscaled 18px Bold Blue Hanyu Pinyin text styles wrapper */
        .pinyin-sub { font-size: 18px; color: #007bff; height: 22px; font-weight: bold; line-height: 22px; text-transform: lowercase; }
        
        /* Verification box styling parameters */
        .chinese-char { display: none; }
        .matched .pinyin-sub { color: #2e7d32; }
        .mismatched .pinyin-sub { color: #c62828; text-decoration: line-through; }
        
        /* Hide configuration switch rules */
        .hide-pinyin .pinyin-sub { visibility: hidden; }
    </style>
</head>
<body>

<div class="card">
    <h2>🇨🇳 Papa Big Chin Free Chinese Practise</h2>
    <p style="margin: 5px 0 12px 0;">Type a phrase, listen, and repeat!</p>
    
    <input type="text" id="targetText" placeholder="输入中文 (e.g. 老师好)" value="老师好">
    
    <div class="preview-box" id="livePreview"></div>
    
    <div class="slider-container">
        <label for="speedSlider" style="font-weight: bold;">Teacher's Voice Speed:</label>
        <div class="slider-row">
            <input type="range" id="speedSlider" min="0.5" max="1.0" step="0.1" value="1.0">
            <span id="speedLabel" style="font-weight: bold; min-width: 70px; text-align: right;">Normal</span>
        </div>
    </div>
    
    <div class="toggle-container">
        <label for="pinyinToggle" style="font-weight: bold; cursor: pointer;">Show Pinyin Subtitles</label>
        <input type="checkbox" id="pinyinToggle" checked style="width: auto; margin: 0; transform: scale(1.3); cursor: pointer;">
    </div>

    <button class="btn-listen" id="listenBtn">🔊 1. Listen to Teacher</button>
    <button class="btn-record" id="recordBtn">🎙️ 2. Press & Speak</button>
    
    <div id="status" style="margin: 8px 0; color: #666; font-size: 14px;">Status: Ready</div>
    
    <div class="result-box" id="resultDiv" style="display: none;">
        <h3>What the app heard:</h3>
        <div id="visualFeedback" style="text-align: center; background: white; padding: 10px; border-radius: 6px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap;"></div>
        <p id="accuracyResult" style="font-weight: bold; text-align: center; margin-top: 10px;"></p>
    </div>

    <div class="button-row">
        <button class="btn-next" id="nextPageBtn">Flash Cards ➡️</button>
    </div>
</div>
<script>
    const targetTextInput = document.getElementById('targetText');
    const livePreview = document.getElementById('livePreview');
    const listenBtn = document.getElementById('listenBtn');
    const recordBtn = document.getElementById('recordBtn');
    const pinyinToggle = document.getElementById('pinyinToggle');
    const speedSlider = document.getElementById('speedSlider');
    const speedLabel = document.getElementById('speedLabel');
    const statusText = document.getElementById('status');
    const resultDiv = document.getElementById('resultDiv');
    const visualFeedback = document.getElementById('visualFeedback');
    const accuracyResult = document.getElementById('accuracyResult');
    const nextPageBtn = document.getElementById('nextPageBtn');

    const globalPinyinTool = pinyinPro.pinyin;

    function createColumnElement(pinyinText, resultStyleClass) {
        const wrapper = document.createElement('div');
        wrapper.className = "char-column " + resultStyleClass;
        
        const pNode = document.createElement('span');
        pNode.className = "pinyin-sub";
        pNode.innerText = pinyinText;
        
        wrapper.appendChild(pNode);
        return wrapper;
    }

    function syncInterfaceLayouts() {
        const txt = targetTextInput.value.trim();
        livePreview.innerHTML = "";
        
        if (!txt) {
            livePreview.innerText = "Waiting for input...";
            return;
        }

        if (pinyinToggle.checked) {
            livePreview.classList.remove('hide-pinyin');
        } else {
            livePreview.classList.add('hide-pinyin');
        }

        const pinStr = globalPinyinTool(txt) || "";
        const pinArr = pinStr.split(" ");
        
        let index = 0;
        while (index < txt.length) {
            const currentPinyin = pinArr[index] || "";
            const inputGridBlock = createColumnElement(currentPinyin, "");
            livePreview.appendChild(inputGridBlock);
            index = index + 1;
        }
    }

    targetTextInput.addEventListener('input', syncInterfaceLayouts);
    pinyinToggle.addEventListener('change', syncInterfaceLayouts);
    window.addEventListener('DOMContentLoaded', syncInterfaceLayouts);

    speedSlider.addEventListener('input', function() {
        const labels = { 
            "1": "Normal", "0.9": "Slower 10%", "0.8": "Slower 20%", 
            "0.7": "Slower 30%", "0.6": "Slower 40%", "0.5": "Slower 50%" 
        };
        speedLabel.innerText = labels[speedSlider.value] || "Normal";
    });

    listenBtn.addEventListener('click', function() {
        const text = targetTextInput.value.trim();
        if (!text) return alert("Please enter a Chinese phrase first!");
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN'; 
        utterance.rate = parseFloat(speedSlider.value);
        window.speechSynthesis.speak(utterance);
    });

    nextPageBtn.addEventListener('click', function() {
        const text = targetTextInput.value.trim();
        if (!text) return alert("Please enter a Chinese phrase first!");
        window.location.href = "flashcards.html?words=" + encodeURIComponent(text);
    });

    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    if (!SpeechRecognition) {
        alert("Your tablet browser does not fully support free voice detection. Please use official Google Chrome.");
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.interimResults = false;
        let isRecording = false;

        recordBtn.addEventListener('click', function() {
            if (!isRecording) {
                const text = targetTextInput.value.trim();
                if (!text) return alert("Please enter the target phrase first!");
                recognition.start();
                isRecording = true;
                recordBtn.innerText = "🛑 Recording... Speak Now";
                recordBtn.classList.add('recording');
                statusText.innerText = "Listening closely to your pronunciation...";
            } else {
                recognition.stop();
            }
        });

        recognition.onresult = function(event) {
            // Fixed correct object nested array path properties
            const resultText = event.results[0][0].transcript;
            analyzeSpeech(resultText);
        };

        recognition.onend = function() {
            isRecording = false;
            recordBtn.innerText = "🎙️ 2. Press & Speak";
            recordBtn.classList.remove('recording');
            statusText.innerText = "Analysis done.";
        };

        function analyzeSpeech(heardText) {
            const targetText = targetTextInput.value.trim();
            visualFeedback.innerHTML = "";
            resultDiv.style.display = "block";
            
            if (pinyinToggle.checked) visualFeedback.classList.remove('hide-pinyin');
            else visualFeedback.classList.add('hide-pinyin');
            
            let correctCount = 0;
            const targetPinyinStr = globalPinyinTool(targetText) || "";
            const targetPinyinArr = targetPinyinStr.split(" ");
            const heardPinyinStr = globalPinyinTool(heardText) || "";
            const heardPinyinArr = heardPinyinStr.split(" ");

            let evalIdx = 0;
            while (evalIdx < targetText.length) {
                const tChar = targetText.charAt(evalIdx);
                const tPin = targetPinyinArr[evalIdx] || "";
                const hPin = heardPinyinArr[evalIdx] || "";
                const hChar = heardText.charAt(evalIdx) || "❓";
                
                if (hChar === tChar || (tPin && tPin === hPin)) {
                    visualFeedback.appendChild(createColumnElement(tPin, "matched"));
                    correctCount = correctCount + 1;
                } else {
                    visualFeedback.appendChild(createColumnElement(tPin, "mismatched"));
                }
                evalIdx = evalIdx + 1;
            }
            const score = Math.round((correctCount / targetText.length) * 100);
            accuracyResult.innerText = "Match Score: " + score + "% (" + correctCount + " of " + targetText.length + " correct)";
        }
    }
</script>
</body>
</html>
