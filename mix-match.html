<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mix and Match Game - Papa Big Chin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        
        /* FIXED: Changed to a single 2-column grid layout that strictly locks rows together */
        .game-arena {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 150px; /* 20px row gap, 150px wide center spacing */
            margin-bottom: 30px;
            justify-items: center;
            align-items: center;
        }
        
        /* Smaller box scale profile */
        .match-box-item {
            background-color: #ffffff;
            border: 2px solid #bdc3c7;
            padding: 12px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            user-select: none;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
            min-height: 46px;
            max-width: 240px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .match-box-item:hover {
            border-color: #3498db;
        }
        .match-box-item.selected {
            border-color: #e67e22;
            background-color: #fdf6ee;
            box-shadow: 0 0 8px rgba(230, 126, 34, 0.3);
        }
        
        /* Pastel Connection Pairing Color Themes */
        .match-box-item.pair-0 { background-color: #dff9fb !important; border-color: #3498db !important; color: #2c3e50; }
        .match-box-item.pair-1 { background-color: #f5cd79 !important; border-color: #e67e22 !important; color: #2c3e50; }
        .match-box-item.pair-2 { background-color: #ffd2d2 !important; border-color: #e74c3c !important; color: #2c3e50; }
        .match-box-item.pair-3 { background-color: #f8a5c2 !important; border-color: #f53b57 !important; color: #2c3e50; }
        .match-box-item.pair-4 { background-color: #ffeaa7 !important; border-color: #fdcb6e !important; color: #2c3e50; }
        
        /* Neon glowing verification status markers */
        .match-box-item.correct {
            border-color: #2ecc71 !important;
            box-shadow: 0 0 15px #2ecc71, inset 0 0 5px rgba(46, 204, 113, 0.5) !important;
            font-weight: bold;
        }
        .match-box-item.incorrect {
            border-color: #e74c3c !important;
            box-shadow: 0 0 15px #e74c3c, inset 0 0 5px rgba(231, 76, 60, 0.5) !important;
            font-weight: bold;
        }
        
        /* Orientation Lock Blocker Overlay Styles */
        .orientation-blocker {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .blocker-content {
            max-width: 400px;
        }
        .blocker-icon {
            font-size: 3.5rem;
            display: inline-block;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }
        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }
        @media screen and (max-width: 767px) and (orientation: portrait) {
            .orientation-blocker { display: flex; }
            body { overflow: hidden; }
        }
        
        .action-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        @media(min-width: 480px) {
            .action-grid {
                grid-template-columns: 1fr 1fr;
            }
            .exit-btn {
                grid-column: span 2;
            }
        }
        .action-btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .verify-btn {
            background-color: #2ecc71;
            color: white;
        }
        .verify-btn:hover {
            background-color: #27ae60;
        }
        .scramble-btn {
            background-color: #e67e22;
            color: white;
        }
        .scramble-btn:hover {
            background-color: #d35400;
        }
        .exit-btn {
            background-color: #95a5a6;
            color: white;
        }
        .exit-btn:hover {
            background-color: #7f8c8d;
        }
        .result-banner {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .result-success { background-color: #eafaf1; color: #27ae60; }
        .result-fail { background-color: #fceae9; color: #c0392b; }
    </style>
</head>
<body>

    <div class="orientation-blocker">
        <div class="blocker-content">
            <span class="blocker-icon">🔄</span>
            <h2>Please Rotate Your Device</h2>
            <p>This activity is best experienced in Landscape Mode. Please turn your phone sideways to unlock the lesson!</p>
        </div>
    </div>

    <div class="container">
        <h1>Chinese Mix & Match</h1>
        <p class="subtitle">Tap a phrase on the left, then tap its translation. Right items snap perfectly onto the same level to match your choice!</p>
        
        <!-- FIXED: Direct unified grid space container for balanced alignments -->
        <div class="game-arena" id="gameArena"></div>

        <div id="resultBanner" class="result-banner"></div>

        <div class="action-grid">
            <button onclick="checkMatches()" class="action-btn verify-btn">Verify Answers ✔️</button>
            <button onclick="scrambleBoard()" class="action-btn scramble-btn">Scramble Order 🔄</button>
            <button onclick="window.location.href='chinese.html'" class="action-btn exit-btn">Exit to Chinese Menu ➔</button>
        </div>
    </div>
    <script>
        var savedPhrases = JSON.parse(localStorage.getItem('chinesePhrases'));
        var savedMatches = JSON.parse(localStorage.getItem('chineseMatches'));

        var defaultPhrases = ["你好吗？", "谢谢你。", "我喜欢学习。", "今天天气很好。", "再见。"];
        var defaultMatches = ["How are you?", "Thank you.", "I like studying.", "The weather is nice today.", "Goodbye."];

        var targetPhrases = savedPhrases && savedPhrases.length === 5 ? savedPhrases : defaultPhrases;
        var targetMatches = savedMatches && savedMatches.length === 5 ? savedMatches : defaultMatches;

        var leftSelected = null;
        var connections = {}; // Tracks { leftOriginalIndex: rightOriginalIndex }
        var isGameLocked = false;

        var leftOrder =;
        var rightOrder =;
        for (var i = 0; i < 5; i++) {
            leftOrder.push(i);
            rightOrder.push(i);
        }

        function shuffle(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        // FIXED: Board rendering now builds matching cell components directly inside a uniform layout
        function buildGameField() {
            connections = {};
            leftSelected = null;
            isGameLocked = false;
            document.getElementById('resultBanner').style.display = 'none';

            shuffle(leftOrder);
            shuffle(rightOrder);

            var arena = document.getElementById('gameArena');
            arena.innerHTML = '';

            // Generate the DOM structures for the left elements first
            leftOrder.forEach(function(originalIndex, currentPosition) {
                var item = document.createElement('div');
                item.className = 'match-box-item';
                item.innerText = targetPhrases[originalIndex];
                item.id = 'left-' + originalIndex;
                
                // Forces left items down Column 1 (Grid Column 1) and stacks them by row position
                item.style.gridColumn = '1';
                item.style.gridRow = (currentPosition + 1).toString();
                
                item.onclick = function() { selectLeftItem(originalIndex); };
                arena.appendChild(item);
            });

            // Generate right side items down Column 2
            rightOrder.forEach(function(originalIndex, currentPosition) {
                var item = document.createElement('div');
                item.className = 'match-box-item';
                item.innerText = targetMatches[originalIndex];
                item.id = 'right-pos-' + currentPosition;
                
                // Forces right items down Column 2 (Grid Column 2) and drops unselected ones below initially
                item.style.gridColumn = '2';
                item.style.gridRow = (currentPosition + 6).toString(); 
                
                item.onclick = function() { selectRightItem(currentPosition); };
                arena.appendChild(item);
            });
        }

        function selectLeftItem(index) {
            if (isGameLocked) return;

            if (leftSelected !== null) {
                document.getElementById('left-' + leftSelected).classList.remove('selected');
            }

            leftSelected = index;
            document.getElementById('left-' + index).classList.add('selected');
        }

        function selectRightItem(currentPosition) {
            if (isGameLocked || leftSelected === null) return;

            // 1. Clean previous matches pointing to this right block coordinate
            for (var leftKey in connections) {
                if (connections[leftKey] === currentPosition) {
                    var oldLeftEl = document.getElementById('left-' + leftKey);
                    for (var c = 0; c < 5; c++) { oldLeftEl.classList.remove('pair-' + c); }
                    delete connections[leftKey];
                }
            }

            var leftEl = document.getElementById('left-' + leftSelected);
            var rightEl = document.getElementById('right-pos-' + currentPosition);
            
            // Clean old styling classes from current selection variables
            if (connections[leftSelected] !== undefined) {
                var oldRightEl = document.getElementById('right-pos-' + connections[leftSelected]);
                if (oldRightEl) {
                    for (var c = 0; c < 5; c++) { oldRightEl.classList.remove('pair-' + c); }
                    oldRightEl.style.gridRow = (currentPosition + 6).toString(); // Send old selection back to baseline storage pool
                }
            }

            for (var c = 0; c < 5; c++) {
                leftEl.classList.remove('pair-' + c);
                rightEl.classList.remove('pair-' + c);
            }

            // 2. Link pairing states
            connections[leftSelected] = currentPosition;
            var colorClass = 'pair-' + leftSelected;

            leftEl.classList.remove('selected');
            leftEl.classList.add(colorClass);
            rightEl.classList.add(colorClass);

            // FIXED: Instantly moves the right item's gridRow position to match the left element exactly!
            var leftTargetGridRow = leftEl.style.gridRow;
            rightEl.style.gridRow = leftTargetGridRow;

            leftSelected = null;
        }

        function checkMatches() {
            var totalLinks = Object.keys(connections).length;
            if (totalLinks < 5) {
                alert("Please make sure all 5 pairs are matched before verifying answers!");
                return;
            }

            isGameLocked = true;
            var correctCount = 0;

            for (var leftIndex in connections) {
                var currentPosition = connections[leftIndex];
                
                var leftEl = document.getElementById('left-' + leftIndex);
                var rightEl = document.getElementById('right-pos-' + currentPosition);

                var correctWordExpected = targetMatches[parseInt(leftIndex)].trim().toLowerCase();
                var userSelectedWord = rightEl.innerText.trim().toLowerCase();

                if (correctWordExpected === userSelectedWord) {
                    leftEl.classList.add('correct');
                    rightEl.classList.add('correct');
                    correctCount++;
                } else {
                    leftEl.classList.add('incorrect');
                    rightEl.classList.add('incorrect');
                }
            }

            var banner = document.getElementById('resultBanner');
            if (correctCount === 5) {
                banner.innerText = "Perfect Score! 5/5 Correct 🎉";
                banner.className = "result-banner result-success";
            } else {
                banner.innerText = "Keep Practicing! " + correctCount + "/5 Matches Correct. Click 'Scramble Order' to try again!";
                banner.className = "result-banner result-fail";
            }
            banner.style.display = 'block';
        }

        function scrambleBoard() {
            buildGameField();
        }

        window.addEventListener('DOMContentLoaded', function() {
            buildGameField();
        });
    </script>
</body>
</html>
