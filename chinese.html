<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Lesson - Papa Big Chin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        
        /* Grid Layout: Symmetrical horizontal level alignments */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 20px;
        }
        
        .phrase-row {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 46px;
        }
        .phrase-number {
            font-weight: bold;
            color: #34495e;
            width: 20px;
        }
        
        /* Single framed container on the right side */
                /* Single framed container on the right side */
        .mix-match-single-box {
            background-color: #fdf6ee; /* Updated to a warm, light orange tint background */
            border: 2px dashed #e67e22; /* Changed border color from blue to solid orange */
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            box-sizing: border-box;
        }
        .mix-match-single-box::before {
            content: "Mix Match";
            position: absolute;
            top: -12px;
            left: 15px;
            background-color: #e67e22; /* Changed background flag indicator color to orange */
            color: white;
            padding: 2px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        
        .full-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
            background-color: white;
            height: 46px;
        }
        .full-input:focus {
            border-color: #3498db;
            outline: none;
        }
        
        .row-action-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
            height: 46px;
        }
        .row-action-btn:hover {
            background-color: #2980b9;
        }
        .row-action-btn.copied {
            background-color: #2ecc71;
        }
        
        /* FIXED: Action Row aligning Listen-Repeat perfectly on the same line as Mix-Match */
        .action-row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        /* Secondary vertical stacked sub-menu below the Listen-Repeat row */
        .sub-navigation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .nav-btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            width: 100%;
        }
        .primary-btn {
            background-color: #2ecc71;
            color: white;
        }
        .primary-btn:hover {
            background-color: #27ae60;
        }
        .mix-match-action-btn {
            background-color: #e67e22;
            color: white;
        }
        .mix-match-action-btn:hover {
            background-color: #d35400;
        }
        .rearrange-btn {
            background-color: #2ecc71;
            color: white;
        }
        .rearrange-btn:hover {
            background-color: #27ae60;
        }
        .back-btn {
            background-color: #95a5a6;
            color: white;
        }
        .back-btn:hover {
            background-color: #7f8c8d;
        }
                /* Full-screen Blocker Overlay Design */
        .orientation-blocker {
            display: none; /* Hidden by default on desktops and larger screens */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            z-index: 99999; /* Forces the blocker to sit on top of everything else */
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .blocker-content {
            max-width: 400px;
        }
        .blocker-icon {
            font-size: 3.5rem;
            display: inline-block;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }
        .orientation-blocker h2 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
        }
        .orientation-blocker p {
            margin: 0;
            color: #bdc3c7;
            font-size: 1rem;
            line-height: 1.4;
        }
        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* 
           RESPONSIVE VIEWPORT TRIGGER: 
           Activates ONLY on screens narrower than 768px (phones) AND when held vertically (portrait).
        */
        @media screen and (max-width: 767px) and (orientation: portrait) {
            .orientation-blocker {
                display: flex; /* Overrides hidden state and forces full-screen flex layout overlay */
            }
            body {
                overflow: hidden; /* Lock background scrolling while the blocker is active */
            }
        }

    </style>
</head>
<body>
<!-- Screen Lock Blocker Overlay for Mobile Portrait Orientation -->
<div class="orientation-blocker">
    <div class="blocker-content">
        <span class="blocker-icon">🔄</span>
        <h2>Please Rotate Your Device</h2>
        <p>This activity is best experienced in Landscape Mode. Please turn your phone sideways to unlock the lesson!</p>
    </div>
</div>

    <div class="container">
        <h1>Chinese Menu</h1>
        <p class="subtitle">Customize your practice items below. Symmetrical button alignment blocks are fully active!</p>
        
        <!-- Primary Grid Layout for Input Rows -->
        <div class="grid-layout">
            <!-- Left Column: Custom Chinese Phrases -->
            <div class="left-column">
                <div class="phrase-row">
                    <span class="phrase-number">1:</span>
                    <input type="text" id="phrase1" class="full-input" value="你好吗？">
                    <button class="row-action-btn" onclick="copyRowText('phrase1', this)">Copy & Paste</button>
                </div>
                <div class="phrase-row">
                    <span class="phrase-number">2:</span>
                    <input type="text" id="phrase2" class="full-input" value="谢谢你。">
                    <button class="row-action-btn" onclick="copyRowText('phrase2', this)">Copy & Paste</button>
                </div>
                <div class="phrase-row">
                    <span class="phrase-number">3:</span>
                    <input type="text" id="phrase3" class="full-input" value="我喜欢学习。">
                    <button class="row-action-btn" onclick="copyRowText('phrase3', this)">Copy & Paste</button>
                </div>
                <div class="phrase-row">
                    <span class="phrase-number">4:</span>
                    <input type="text" id="phrase4" class="full-input" value="今天天气很好。">
                    <button class="row-action-btn" onclick="copyRowText('phrase4', this)">Copy & Paste</button>
                </div>
                <div class="phrase-row">
                    <span class="phrase-number">5:</span>
                    <input type="text" id="phrase5" class="full-input" value="再见。">
                    <button class="row-action-btn" onclick="copyRowText('phrase5', this)">Copy & Paste</button>
                </div>
            </div>

            <!-- Right Column: Single Labeled Mix Match Box containing all targets -->
            <div class="mix-match-single-box">
                <input type="text" id="match1" class="full-input" value="How are you?">
                <input type="text" id="match2" class="full-input" value="Thank you.">
                <input type="text" id="match3" class="full-input" value="I like studying.">
                <input type="text" id="match4" class="full-input" value="The weather is nice today.">
                <input type="text" id="match5" class="full-input" value="Goodbye.">
            </div>
        </div>

        <!-- FIXED: Listen-Repeat aligns on the exact same row level as Mix-Match -->
        <div class="action-row-grid">
            <button onclick="navigateTo('listen-repeat.html')" class="nav-btn primary-btn">Listen and Repeat</button>
            <button onclick="navigateTo('mix-match.html')" class="nav-btn mix-match-action-btn">Mix and Match Game ➔</button>
        </div>

        <!-- Secondary Navigation Grid: Rearrange sits perfectly below Listen-Repeat -->
        <div class="sub-navigation-grid">
            <button onclick="navigateTo('rearrange.html')" class="nav-btn rearrange-btn">Rearrange</button>
            <button onclick="navigateTo('index.html')" class="nav-btn back-btn">Back to Main Menu</button>
        </div>
    </div>

    <script>
        // Load all 10 saved settings inputs from cache storage parameters on load initialization
        window.addEventListener('DOMContentLoaded', () => {
            const savedPhrases = JSON.parse(localStorage.getItem('chinesePhrases'));
            const savedMatches = JSON.parse(localStorage.getItem('chineseMatches'));
            
            if (savedPhrases && savedPhrases.length === 5) {
                for (let i = 0; i < 5; i++) {
                    document.getElementById('phrase' + (i + 1)).value = savedPhrases[i];
                }
            }
            
            if (savedMatches && savedMatches.length === 5) {
                for (let i = 0; i < 5; i++) {
                    document.getElementById('match' + (i + 1)).value = savedMatches[i];
                }
            }
        });

        function copyRowText(fieldId, buttonElement) {
            const targetInput = document.getElementById(fieldId);
            if (targetInput && targetInput.value.trim() !== '') {
                navigator.clipboard.writeText(targetInput.value).then(() => {
                    const originalText = buttonElement.innerText;
                    buttonElement.innerText = "Copied!";
                    buttonElement.classList.add('copied');
                    setTimeout(() => {
                        buttonElement.innerText = originalText;
                        buttonElement.classList.remove('copied');
                    }, 2000);
                }).catch(err => console.error('Failed to copy text: ', err));
            }
        }

        // Cache persistent elements into localStorage before transitioning dynamic window views
        function navigateTo(targetPage) {
            const phrases = [
                document.getElementById('phrase1').value,
                document.getElementById('phrase2').value,
                document.getElementById('phrase3').value,
                document.getElementById('phrase4').value,
                document.getElementById('phrase5').value
            ];

            const matches = [
                document.getElementById('match1').value,
                document.getElementById('match2').value,
                document.getElementById('match3').value,
                document.getElementById('match4').value,
                document.getElementById('match5').value
            ];

            localStorage.setItem('chinesePhrases', JSON.stringify(phrases));
            localStorage.setItem('chineseMatches', JSON.stringify(matches));
            
            window.location.href = targetPage;
        }
    </script>

</body>
</html>
