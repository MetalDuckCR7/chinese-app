<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rearrange Exercise - Papa Big Chin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .exercise-block {
            background-color: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .phrase-number {
            font-weight: bold;
            color: #2c3e50;
        }
        .status-message {
            font-weight: bold;
            font-size: 0.95rem;
        }
        .status-pending { color: #e67e22; }
        .status-success { color: #2ecc71; }
        
        /* Workspace Areas */
        .workspace {
            background-color: #ffffff;
            border: 2px dashed #bdc3c7;
            border-radius: 6px;
            padding: 12px;
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .tile-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        /* Interactive Character Tiles */
        .char-tile {
            background-color: #3498db;
            color: white;
            padding: 10px 16px;
            font-size: 1.3rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s, transform 0.1s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .char-tile:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }
        .char-tile.selected {
            background-color: #95a5a6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        /* Action Buttons Grid */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 25px;
        }
        @media(min-width: 480px) {
            .action-grid {
                grid-template-columns: 1fr 1fr;
            }
            .back-btn {
                grid-column: span 2;
            }
        }
        .action-btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .scramble-btn {
            background-color: #e67e22;
            color: white;
        }
        .scramble-btn:hover {
            background-color: #d35400;
        }
        .back-btn {
            background-color: #95a5a6;
            color: white;
        }
        .back-btn:hover {
            background-color: #7f8c8d;
        }
                /* Full-screen Blocker Overlay Design */
        .orientation-blocker {
            display: none; /* Hidden by default on desktops and larger screens */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            z-index: 99999; /* Forces the blocker to sit on top of everything else */
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .blocker-content {
            max-width: 400px;
        }
        .blocker-icon {
            font-size: 3.5rem;
            display: inline-block;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }
        .orientation-blocker h2 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
        }
        .orientation-blocker p {
            margin: 0;
            color: #bdc3c7;
            font-size: 1rem;
            line-height: 1.4;
        }
        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* 
           RESPONSIVE VIEWPORT TRIGGER: 
           Activates ONLY on screens narrower than 768px (phones) AND when held vertically (portrait).
        */
        @media screen and (max-width: 767px) and (orientation: portrait) {
            .orientation-blocker {
                display: flex; /* Overrides hidden state and forces full-screen flex layout overlay */
            }
            body {
                overflow: hidden; /* Lock background scrolling while the blocker is active */
            }
        }

    </style>
</head>
<body>
    <!-- Screen Lock Blocker Overlay for Mobile Portrait Orientation -->
<div class="orientation-blocker">
    <div class="blocker-content">
        <span class="blocker-icon">🔄</span>
        <h2>Please Rotate Your Device</h2>
        <p>This activity is best experienced in Landscape Mode. Please turn your phone sideways to unlock the lesson!</p>
    </div>
</div>

    <div class="container">
        <h1>Rearrange Words</h1>
        <p class="subtitle">Click the scrambled tiles below in the correct order to rebuild each phrase!</p>
        
        <!-- The 5 interactive exercise items will be built here dynamically by JavaScript -->
        <div id="exerciseContainer"></div>

        <!-- System controls at the base of the framework dashboard -->
        <div class="action-grid">
            <button onclick="scrambleAllExercises()" class="action-btn scramble-btn">Scramble All Again 🔄</button>
            <button onclick="window.location.href='chinese.html'" class="action-btn back-btn">Back to Chinese Menu</button>
        </div>
    </div>
    <script>
        // 1. Fetch custom phrases from user edits on the main page
        const savedPhrases = JSON.parse(localStorage.getItem('chinesePhrases'));
        const defaultPhrases = ["你好吗？", "谢谢你。", "我喜欢学习。", "今天天气很好。", "再见。"];
        const phrasesToPlay = savedPhrases && savedPhrases.length === 5 ? savedPhrases : defaultPhrases;

        // Tracks game states for each row index
        let gameStates = [];

        // Fisher-Yates pure shuffle utility
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 2. Initialize and draw the 5 dynamic exercise items
        function initExercises() {
            const container = document.getElementById('exerciseContainer');
            container.innerHTML = '';
            gameStates = [];

            phrasesToPlay.forEach((phrase, rowIndex) => {
                // Break down characters cleanly (handling spaces safely)
                const targetArray = Array.from(phrase.trim());
                
                // Shuffle pool tiles until they don't match target order directly
                let poolArray = shuffleArray(targetArray);
                if (targetArray.length > 1 && poolArray.join('') === targetArray.join('')) {
                    poolArray = shuffleArray(targetArray);
                }

                // Track indices state records
                gameStates.push({
                    target: targetArray,
                    pool: poolArray,
                    userSelection: [], // Stores selected indices from the pool
                    isCorrect: false
                });

                // Build HTML block container utilizing safe string concatenation
                const block = document.createElement('div');
                block.className = 'exercise-block';
                block.id = 'block-' + rowIndex;

                let rowHTML = '<div class="row-header">' +
                    '<span class="phrase-number">Phrase ' + (rowIndex + 1) + '</span>' +
                    '<span class="status-message status-pending" id="status-' + rowIndex + '">Keep Trying...</span>' +
                '</div>' +
                '<div class="workspace" id="workspace-' + rowIndex + '" onclick="resetRowSelection(' + rowIndex + ')" title="Click inside workspace to reset this row"></div>' +
                '<div class="tile-pool" id="pool-' + rowIndex + '"></div>';

                block.innerHTML = rowHTML;
                container.appendChild(block);

                renderPoolTiles(rowIndex);
            });
        }

        // Render the pool tiles for a specific row
        function renderPoolTiles(rowIndex) {
            const poolContainer = document.getElementById('pool-' + rowIndex);
            const state = gameStates[rowIndex];
            poolContainer.innerHTML = '';

            state.pool.forEach((char, tileIndex) => {
                const tile = document.createElement('div');
                tile.className = 'char-tile';
                tile.innerText = char;
                tile.id = 'tile-' + rowIndex + '-' + tileIndex;

                // Check if tile has already been clicked/selected
                if (state.userSelection.includes(tileIndex)) {
                    tile.classList.add('selected');
                } else {
                    tile.onclick = function(e) {
                        e.stopPropagation(); // Avoid triggering workspace click
                        handleTileClick(rowIndex, tileIndex);
                    };
                }
                poolContainer.appendChild(tile);
            });
        }

        // Render the workspace text array for a specific row
        function renderWorkspace(rowIndex) {
            const wsContainer = document.getElementById('workspace-' + rowIndex);
            const state = gameStates[rowIndex];
            wsContainer.innerHTML = '';

            state.userSelection.forEach((tileIndex) => {
                const textNode = document.createElement('span');
                textNode.style.fontSize = '1.4rem';
                textNode.style.fontWeight = 'bold';
                textNode.style.color = '#2c3e50';
                textNode.innerText = state.pool[tileIndex];
                wsContainer.appendChild(textNode);
            });
        }

        // Core validation logic loop executed on click
        function handleTileClick(rowIndex, tileIndex) {
            const state = gameStates[rowIndex];
            if (state.isCorrect) return; // Prevent edits if already validated

            state.userSelection.push(tileIndex);
            
            renderWorkspace(rowIndex);
            renderPoolTiles(rowIndex);
            checkAnswer(rowIndex);
        }

        // Reset user selection inside workspace for a row
        function resetRowSelection(rowIndex) {
            const state = gameStates[rowIndex];
            if (state.isCorrect) return; // Prevent reset if row is complete

            state.userSelection = [];
            
            const statusEl = document.getElementById('status-' + rowIndex);
            statusEl.innerText = "Keep Trying...";
            statusEl.className = "status-message status-pending";

            renderWorkspace(rowIndex);
            renderPoolTiles(rowIndex);
        }

        // Verify selections match original phrase mapping indexes
        function checkAnswer(rowIndex) {
            const state = gameStates[rowIndex];
            
            // Build the text sequence string selected by user
            let userString = "";
            state.userSelection.forEach(index => {
                userString += state.pool[index];
            });

            const targetString = state.target.join('');

            // Perfect dynamic index verification matches match rules
            if (userString === targetString) {
                state.isCorrect = true;
                const statusEl = document.getElementById('status-' + rowIndex);
                statusEl.innerText = "Correct! 🎉";
                statusEl.className = "status-message status-success";
                
                // Block workspace click resets once correctly submitted
                document.getElementById('workspace-' + rowIndex).onclick = null;
                document.getElementById('workspace-' + rowIndex).title = "Solved";
            } else if (state.userSelection.length === state.target.length) {
                const statusEl = document.getElementById('status-' + rowIndex);
                statusEl.innerText = "Incorrect order. Click inside the white box to reset this row!";
                statusEl.className = "status-message status-pending";
            }
        }

        // Reshuffles game matrix without altering localStorage inputs
        function scrambleAllExercises() {
            initExercises();
        }

        // Run boot loops on document content ready structures
        window.addEventListener('DOMContentLoaded', () => {
            initExercises();
        });
    </script>
</body>
</html>
