<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rearrange Bahasa Melayu - Papa Big Chin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .exercise-block {
            background-color: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .phrase-number {
            font-weight: bold;
            color: #2c3e50;
        }
        .status-message {
            font-weight: bold;
            font-size: 0.95rem;
        }
        .status-pending { color: #e67e22; }
        .status-success { color: #2ecc71; }
        
        .workspace {
            background-color: #ffffff;
            border: 2px dashed #bdc3c7;
            border-radius: 6px;
            padding: 12px;
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .tile-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        /* Interactive Word Tiles split by space tokens */
        .word-tile {
            background-color: #3498db;
            color: white;
            padding: 10px 16px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s, transform 0.1s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .word-tile:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }
        .word-tile.selected {
            background-color: #95a5a6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        /* Responsive Orientation Blocker Overlay */
        .orientation-blocker {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .blocker-content {
            max-width: 400px;
        }
        .blocker-icon {
            font-size: 3.5rem;
            display: inline-block;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }
        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }
        @media screen and (max-width: 767px) and (orientation: portrait) {
            .orientation-blocker { display: flex; }
            body { overflow: hidden; }
        }
        
        .action-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 25px;
        }
        @media(min-width: 480px) {
            .action-grid {
                grid-template-columns: 1fr 1fr;
            }
            .back-btn {
                grid-column: span 2;
            }
        }
        .action-btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .scramble-btn {
            background-color: #e67e22;
            color: white;
        }
        .scramble-btn:hover {
            background-color: #d35400;
        }
        .back-btn {
            background-color: #95a5a6;
            color: white;
        }
        .back-btn:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    <!-- Responsive Orientation Blocker Overlay Wrapper -->
    <div class="orientation-blocker">
        <div class="blocker-content">
            <span class="blocker-icon">🔄</span>
            <h2>Sila Putar Peranti Anda</h2>
            <p>Aktiviti ini paling baik dialami dalam Mod Landskap. Sila pusingkan telefon anda ke sisi untuk membuka kunci pelajaran!</p>
        </div>
    </div>

    <div class="container">
        <h1>Susun Semula Perkataan</h1>
        <p class="subtitle">Klik kotak perkataan yang berselerak di bawah mengikut susunan ayat Bahasa Melayu yang betul!</p>
        
        <!-- Interactive game arena block populated dynamically by Javascript engine -->
        <div id="exerciseContainer"></div>

        <!-- System Controls Base Dashboard Grid -->
        <div class="action-grid">
            <button onclick="scrambleAllExercises()" class="action-btn scramble-btn">Selerakkan Semua 🔄</button>
            <button onclick="window.location.href='bahasa-melayu.html'" class="action-btn back-btn">Kembali ke Menu Utama</button>
        </div>
    </div>
    <script>
        // 1. Fetch custom Malay phrases from user edits
        var savedPhrases = JSON.parse(localStorage.getItem('bmPhrases'));
        var defaultPhrases = ["Apa khabar?", "Terima kasih.", "Saya suka belajar.", "Cuaca hari ini sangat bagus.", "Selamat tinggal."];
        var phrasesToPlay = savedPhrases && savedPhrases.length === 5 ? savedPhrases : defaultPhrases;

        // Tracks game states for each row index
        var gameStates = [];

        // Fisher-Yates shuffle utility loop
        function shuffleArray(array) {
            var shuffled = [...array];
            for (var i = shuffled.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = shuffled[i];
                shuffled[i] = shuffled[j];
                shuffled[j] = temp;
            }
            return shuffled;
        }

        // 2. Initialize and draw the 5 dynamic exercise items split by spaces
        function initExercises() {
            var container = document.getElementById('exerciseContainer');
            container.innerHTML = '';
            gameStates = [];

            phrasesToPlay.forEach(function(phrase, rowIndex) {
                // MALAY SPLITTING RULE: Split cleanly by space boundaries to handle whole words
                var targetArray = phrase.trim().split(/\s+/);
                
                // Shuffle pool tiles until they don't match target order directly
                var poolArray = shuffleArray(targetArray);
                if (targetArray.length > 1 && poolArray.join(' ') === targetArray.join(' ')) {
                    poolArray = shuffleArray(targetArray);
                }

                // Track indices state records
                gameStates.push({
                    target: targetArray,
                    pool: poolArray,
                    userSelection: [], // Stores selected indices from the pool
                    isCorrect: false
                });

                // Build HTML structural row blocks using safe text concatenations
                var block = document.createElement('div');
                block.className = 'exercise-block';
                block.id = 'block-' + rowIndex;

                block.innerHTML = '<div class="row-header">' +
                    '<span class="phrase-number">Ayat ' + (rowIndex + 1) + '</span>' +
                    '<span class="status-message status-pending" id="status-' + rowIndex + '">Cuba Lagi...</span>' +
                '</div>' +
                '<div class="workspace" id="workspace-' + rowIndex + '" onclick="resetRowSelection(' + rowIndex + ')" title="Klik kotak putih ini untuk set semula susunan"></div>' +
                '<div class="tile-pool" id="pool-' + rowIndex + '"></div>';

                container.appendChild(block);
                renderPoolTiles(rowIndex);
            });
        }

        // Render the clickable word pool tiles for a specific row
        function renderPoolTiles(rowIndex) {
            var poolContainer = document.getElementById('pool-' + rowIndex);
            var state = gameStates[rowIndex];
            poolContainer.innerHTML = '';

            state.pool.forEach(function(word, tileIndex) {
                var tile = document.createElement('div');
                tile.className = 'word-tile';
                tile.innerText = word;
                tile.id = 'tile-' + rowIndex + '-' + tileIndex;

                // Check if tile has already been clicked/selected
                if (state.userSelection.includes(tileIndex)) {
                    tile.classList.add('selected');
                } else {
                    tile.onclick = function(e) {
                        e.stopPropagation(); // Avoid triggering workspace click reset
                        handleTileClick(rowIndex, tileIndex);
                    };
                }
                poolContainer.appendChild(tile);
            });
        }

        // Render the workspace text array for a specific row
        function renderWorkspace(rowIndex) {
            var wsContainer = document.getElementById('workspace-' + rowIndex);
            var state = gameStates[rowIndex];
            wsContainer.innerHTML = '';

            state.userSelection.forEach(function(tileIndex) {
                var textNode = document.createElement('span');
                textNode.style.fontSize = '1.2rem';
                textNode.style.fontWeight = 'bold';
                textNode.style.color = '#2c3e50';
                textNode.style.backgroundColor = '#e1f5fe';
                textNode.style.padding = '4px 10px';
                textNode.style.borderRadius = '4px';
                textNode.innerText = state.pool[tileIndex];
                wsContainer.appendChild(textNode);
            });
        }

        // Core validation logic loop executed on click
        function handleTileClick(rowIndex, tileIndex) {
            var state = gameStates[rowIndex];
            if (state.isCorrect) return; // Prevent edits if already validated

            state.userSelection.push(tileIndex);
            
            renderWorkspace(rowIndex);
            renderPoolTiles(rowIndex);
            checkAnswer(rowIndex);
        }

        // Reset user selection inside workspace for a row
        function resetRowSelection(rowIndex) {
            var state = gameStates[rowIndex];
            if (state.isCorrect) return; // Prevent reset if row is complete

            state.userSelection = [];
            
            var statusEl = document.getElementById('status-' + rowIndex);
            statusEl.innerText = "Cuba Lagi...";
            statusEl.className = "status-message status-pending";

            renderWorkspace(rowIndex);
            renderPoolTiles(rowIndex);
        }

        // Verify selections match original phrase mapping indexes
        function checkAnswer(rowIndex) {
            var state = gameStates[rowIndex];
            
            // Build the text sequence string selected by user joined by word space tokens
            var userString = "";
            state.userSelection.forEach(function(index, i) {
                userString += (i === 0 ? "" : " ") + state.pool[index];
            });

            var targetString = state.target.join(' ');

            // Symmetrical sentence validation match checks
            if (userString === targetString) {
                state.isCorrect = true;
                var statusEl = document.getElementById('status-' + rowIndex);
                statusEl.innerText = "Betul! 🎉";
                statusEl.className = "status-message status-success";
                
                // Block workspace click resets once correctly submitted
                document.getElementById('workspace-' + rowIndex).onclick = null;
                document.getElementById('workspace-' + rowIndex).title = "Selesai";
            } else if (state.userSelection.length === state.target.length) {
                var statusEl = document.getElementById('status-' + rowIndex);
                statusEl.innerText = "Susunan salah. Klik kotak putih untuk cuba semula!";
                statusEl.className = "status-message status-pending";
            }
        }

        // Reshuffles game matrix without altering localStorage inputs
        function scrambleAllExercises() {
            initExercises();
        }

        // Run boot loops on document content ready structures
        window.addEventListener('DOMContentLoaded', function() {
            initExercises();
        });
    </script>
</body>
</html>
