<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen and Repeat - Papa Big Chin</title>
    
    <!-- Stable CDN link for the Pinyin engine -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.2/dist/index.js"></script>



    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 650px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .phrase-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .phrase-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .phrase-number {
            font-weight: bold;
            color: #7f8c8d;
            width: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #dcdde1;
            border-radius: 6px;
            font-size: 1.1rem;
            color: #2c3e50;
        }
        .locked-field {
            background-color: #f5f6fa;
            color: #7f8c8d;
            cursor: not-allowed;
        }
        .copy-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        .copy-btn:hover {
            background-color: #2980b9;
        }
        .copy-btn.copied {
            background-color: #2ecc71;
        }
        
        .pinyin-panel {
            background-color: #ebf3f9;
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .panel-header h3 {
            margin: 0;
            color: #2c3e50;
            font-size: 1.1rem;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .audio-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .audio-btn:hover {
            background-color: #d35400;
        }
        .record-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .record-btn:hover {
            background-color: #c0392b;
        }
        .record-btn.recording {
            background-color: #9b59b6;
        }
        
        .speed-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 8px 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #34495e;
            font-weight: 500;
        }
        .speed-control-inner {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .speed-box input[type="range"] {
            cursor: pointer;
            width: 120px;
        }
        .score-badge {
            font-weight: bold;
            font-size: 0.95rem;
            color: white;
            background-color: #2c3e50;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .visualizer-container {
            width: 100%;
            background-color: #1e272e;
            border-radius: 6px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid #2c3e50;
            display: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 60px;
        }
        
        .switch-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #2c3e50;
            font-weight: bold;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #bdc3c7;
            transition: .3s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2ecc71;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        
        .aligned-display {
            background-color: #ffffff;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            padding: 15px;
            min-height: 50px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .char-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-width: 30px;
        }
        .char-chinese {
            font-size: 1.5rem;
            color: #2c3e50;
            font-weight: 500;
            margin-bottom: 4px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .char-correct {
            color: #ffffff !important;
            background-color: #2ecc71;
        }
        .char-incorrect {
            color: #ffffff !important;
            background-color: #e74c3c;
        }

        .char-pinyin {
            font-size: 1rem;
            color: #e67e22;
            font-weight: bold;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .hidden-pinyin {
            opacity: 0 !important;
            visibility: hidden;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .back-btn:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>


<div class="container">
        <h1>Listen & Repeat</h1>
        
        
        <div class="phrase-list" id="phraseContainer"></div>

        <div class="pinyin-panel">
            <div class="panel-header">
                <h3>Pinyin & Pronunciation Assistant</h3>
                <div class="controls-group">
                    <button id="playAudioBtn" class="audio-btn" style="display: none;" onclick="speakActiveText()">Play Audio 🔊</button>
                    <button id="recordAudioBtn" class="record-btn" style="display: none;" onclick="handleSpeechRecording()">Record & Verify 🎙️</button>
                    <div class="switch-container">
                        <span>Show Pinyin</span>
                        <label class="switch">
                            <input type="checkbox" id="pinyinToggle" checked onchange="togglePinyinVisibility()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div id="speedControlBox" class="speed-box" style="display: none;">
                <div class="speed-control-inner">
                    <span>Speech Speed:</span>
                    <input type="range" id="speechRate" min="25" max="100" step="5" value="100" oninput="updateSpeedLabel(this.value)">
                    <span id="rateVal">100%</span>
                </div>
                <div id="scoreDisplay" class="score-badge" style="display: none;">Score: --</div>
            </div>

            <div id="visualizerContainer" class="visualizer-container">
                <canvas id="waveCanvas"></canvas>
            </div>
            
            <div class="aligned-display" id="pinyinDisplay">
                <span style="color: #7f8c8d;">Click Copy & Paste above to see the alignment layout...</span>
            </div>
        </div>

        <button onclick="window.location.href='chinese.html'" class="back-btn">Back to Chinese Menu</button>
    </div>

        <script>
        var savedPhrases = JSON.parse(localStorage.getItem('chinesePhrases'));
        var defaultPhrases = ["你好吗？", "谢谢你。", "我喜欢学习。", "今天天气很好。", "再见。"];
        var phrasesToDisplay = savedPhrases && savedPhrases.length === 5 ? savedPhrases : defaultPhrases;
        
        var currentActiveText = "";
        var container = document.getElementById('phraseContainer');

        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        var recognition = null;
        var isRecording = false;
        
        var audioContext = null;
        var analyser = null;
        var dataArray = null;
        var animationFrameId = null;
        var micStream = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
        }

        // Build core elements using standard string concatenation
        phrasesToDisplay.forEach(function(phrase, index) {
            var row = document.createElement('div');
            row.className = 'phrase-row';
            var uniqueId = 'listenField-' + index;

            row.innerHTML = '<span class="phrase-number">' + (index + 1) + ':</span>' +
                            '<input type="text" id="' + uniqueId + '" class="locked-field" value="' + phrase.replace(/"/g, '&quot;') + '" readonly>' +
                            '<button class="copy-btn" onclick="handleCopyAndPaste(\'' + uniqueId + '\', this)">Copy & Paste</button>';
            container.appendChild(row);
        });

        function handleCopyAndPaste(fieldId, buttonElement) {
            var targetInput = document.getElementById(fieldId);
            
            if (targetInput && targetInput.value.trim() !== '') {
                currentActiveText = targetInput.value;

                navigator.clipboard.writeText(currentActiveText).then(function() {
                    var originalText = buttonElement.innerText;
                    buttonElement.innerText = "Copied!";
                    buttonElement.classList.add('copied');
                    setTimeout(function() {
                        buttonElement.innerText = originalText;
                        buttonElement.classList.remove('copied');
                    }, 2000);
                }).catch(function(err) { console.error('Clipboard error:', err); });

                document.getElementById('playAudioBtn').style.display = 'inline-block';
                if (recognition) {
                    document.getElementById('recordAudioBtn').style.display = 'inline-block';
                }
                document.getElementById('speedControlBox').style.display = 'flex';
                document.getElementById('scoreDisplay').style.display = 'none';
                document.getElementById('visualizerContainer').style.display = 'none';
                
                stopVisualizer();
                translateToPinyin(currentActiveText);
            }
        }

        function updateSpeedLabel(val) {
            document.getElementById('rateVal').innerText = val + '%';
        }

        function translateToPinyin(text) {
            var display = document.getElementById('pinyinDisplay');
            var showPinyin = document.getElementById('pinyinToggle').checked;
            
            if (!text || text.trim() === '') {
                display.innerHTML = '<span style="color: #7f8c8d;">Click "Copy & Paste" above to see the alignment layout...</span>';
                return;
            }

            try {
                if (typeof pinyinPro !== 'undefined' && pinyinPro.pinyin) {
                    var chars = Array.from(text);
                    var pinyinArray = pinyinPro.pinyin(text, { type: 'array', toneType: 'symbol' });
                    
                    display.innerHTML = '';

                    chars.forEach(function(char, index) {
                        var col = document.createElement('div');
                        col.className = 'char-column';
                        var pinyinVal = pinyinArray[index] || '';
                        var hideClass = showPinyin ? '' : 'hidden-pinyin';
                        var finalPinyin = (pinyinVal === char) ? '&nbsp;' : pinyinVal;

                        col.innerHTML = '<span class="char-chinese" id="char-index-' + index + '">' + char + '</span>' +
                                        '<span class="char-pinyin ' + hideClass + '">' + finalPinyin + '</span>';
                        display.appendChild(col);
                    });
                } else {
                    display.innerText = "Loading library components...";
                }
            } catch (error) {
                display.innerText = "Error parsing text data.";
                console.error(error);
            }
        }

        function speakActiveText() {
            if (!currentActiveText) return;
            window.speechSynthesis.cancel();

            var utterance = new SpeechSynthesisUtterance(currentActiveText);
            utterance.lang = 'zh-CN';
            var sliderVal = parseInt(document.getElementById('speechRate').value);
            utterance.rate = sliderVal / 100;

            window.speechSynthesis.speak(utterance);
        }
                function handleSpeechRecording() {
            if (!recognition) return;
            if (isRecording) {
                // FORCE ENGINE COMPLETE: Stops recording and immediately forces analysis on what it heard
                recognition.stop();
            } else {
                startSpeechRecognition();
            }
        }

        function startSpeechRecognition() {
            if (!currentActiveText) return;

            document.querySelectorAll('.char-chinese').forEach(function(el) {
                el.className = 'char-chinese';
            });

            navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
                micStream = stream;
                isRecording = true;

                var recordBtn = document.getElementById('recordAudioBtn');
                recordBtn.innerText = "Stop & Analyze 🟥";
                recordBtn.classList.add('recording');
                document.getElementById('visualizerContainer').style.display = 'block';

                startVisualizer(stream);
                recognition.start();
            }).catch(function(err) {
                console.error('Mic access denied:', err);
                alert("Please allow mic access to check pronunciation!");
            });

            // FIXED: Handles fast intermediate voice calculations so results capture immediately on stop
            recognition.onresult = function(event) {
                if (event.results && event.results[0]) {
                    var spokenText = event.results[0][0].transcript;
                    verifyPronunciation(spokenText);
                }
            };

            recognition.onerror = function(event) {
                console.error('Speech engine error:', event.error);
                cleanupRecordingUI();
            };

            recognition.onend = function() {
                cleanupRecordingUI();
            };
        }

        function cleanupRecordingUI() {
            isRecording = false;
            var recordBtn = document.getElementById('recordAudioBtn');
            recordBtn.innerText = "Record & Verify 🎙️";
            recordBtn.classList.remove('recording');
            stopVisualizer();
        }

        function startVisualizer(stream) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                var source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                
                source.connect(analyser);
                
                var bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                var canvas = document.getElementById('waveCanvas');
                var canvasCtx = canvas.getContext('2d');
                
                canvas.width = canvas.parentElement.offsetWidth;
                canvas.height = 60;

                function draw() {
                    if (!isRecording) return;
                    animationFrameId = requestAnimationFrame(draw);
                    
                    analyser.getByteTimeDomainData(dataArray);
                    
                    canvasCtx.fillStyle = '#1e272e';
                    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = '#2ecc71';
                    canvasCtx.beginPath();
                    
                    var sliceWidth = canvas.width * 1.0 / bufferLength;
                    var x = 0;
                    
                    for (var i = 0; i < bufferLength; i++) {
                        var v = dataArray[i] / 128.0;
                        var vY = v * canvas.height / 2;
                        
                        if (i === 0) {
                            canvasCtx.moveTo(x, vY);
                        } else {
                            canvasCtx.lineTo(x, vY);
                        }
                        x += sliceWidth;
                    }
                    
                    canvasCtx.lineTo(canvas.width, canvas.height / 2);
                    canvasCtx.stroke();
                }
                draw();
            } catch (e) {
                console.error("Canvas link context crash:", e);
            }
        }

        function stopVisualizer() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (audioContext) audioContext.close();
            if (micStream) {
                micStream.getTracks().forEach(function(track) { track.stop(); });
            }
        }

        function verifyPronunciation(spoken) {
            if (!spoken) return;

            // Normalize characters for calculation mapping
            var cleanTarget = currentActiveText.replace(/[.,\/#!\$%\^&\*;:{}=\-_`~()？。，！\s]/g,"");
            var cleanSpoken = spoken.replace(/[.,\/#!\$%\^&\*;:{}=\-_`~()？。，！\s]/g,"");
            
            // Accessing the pinyinPro global library engine cleanly
            var pinyinEngine = window.pinyinPro || pinyinPro;
            if (!pinyinEngine || !pinyinEngine.pinyin) {
                console.error("Pinyin library not loaded yet.");
                return;
            }

            var targetPinyins = pinyinEngine.pinyin(cleanTarget, { type: 'array', toneType: 'symbol' });
            var spokenPinyins = pinyinEngine.pinyin(cleanSpoken, { type: 'array', toneType: 'symbol' });

            var correctCount = 0;
            var targetCharsArray = Array.from(currentActiveText);

            var cleanIndex = 0;
            targetCharsArray.forEach(function(char, index) {
                var charEl = document.getElementById('char-index-' + index);
                if (!charEl) return;

                if (/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！\s]/.test(char)) {
                    return;
                }

                var targetPinyin = targetPinyins[cleanIndex];
                var spokenPinyin = spokenPinyins[cleanIndex];

                if (spokenPinyin && targetPinyin === spokenPinyin) {
                    charEl.className = 'char-chinese char-correct';
                    correctCount++;
                } else {
                    charEl.className = 'char-chinese char-incorrect';
                }
                cleanIndex++;
            });

            var totalCleanChars = targetPinyins.length;
            var scorePercentage = totalCleanChars > 0 ? Math.round((correctCount / totalCleanChars) * 100) : 0;

            var scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.innerText = 'Score: ' + scorePercentage + '%';
            scoreDisplay.style.display = 'inline-block';
        }

        function togglePinyinVisibility() {
            var pinyinElements = document.querySelectorAll('.char-pinyin');
            var showPinyin = document.getElementById('pinyinToggle').checked;

            pinyinElements.forEach(function(el) {
                if (showPinyin) {
                    el.classList.remove('hidden-pinyin');
                } else {
                    el.classList.add('hidden-pinyin');
                }
            });
        }
    </script>
</body>
</html>
