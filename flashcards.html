<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Flashcards</title>
    <!-- Import pinyin-pro library via CDN -->
    <script src="https://unpkg.com/pinyin-pro"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .status-msg {
            margin-bottom: 12px;
            font-size: 1rem;
            color: #7f8c8d;
            font-weight: bold;
            min-height: 24px;
            text-align: center;
        }

        .test-panel {
            background: #eef2f7;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #555;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px dashed #bdc3c7;
        }

        .test-panel button {
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: white;
        }

        .flashcard-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            aspect-ratio: 3 / 4; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #2c3e50;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            cursor: pointer;
        }

        .card.recording {
            border-color: #e67e22 !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(230, 126, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); }
        }

        .card.incorrect {
            color: #e74c3c !important;
            border-color: #e74c3c !important;
            background-color: #fff5f5;
        }

        .card.correct {
            color: #2ecc71 !important;
            border-color: #2ecc71 !important;
            background-color: #f5fff7;
            pointer-events: none; 
            box-shadow: none;
            transform: none !important;
        }

        @media (min-width: 768px) {
            h1 { font-size: 2.2rem; }
            .flashcard-container {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 20px;
                max-width: 900px;
            }
            .card { font-size: 3.5rem; }
        }

        .back-btn {
            margin-top: 32px;
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        .back-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <h1>Study Deck</h1>
    <div class="status-msg" id="statusMessage">Tap a card and speak the character clearly.</div>

    <div class="test-panel">
        <span>⚙️ <strong>Test Helper:</strong> If voice recognition fails, select a card then click:</span>
        <button onclick="simulateResult(true)">Force Success (Green)</button>
        <button onclick="simulateResult(false)">Force Failure (Red)</button>
    </div>

    <div class="flashcard-container" id="cardContainer">
        <!-- Cards injected dynamically -->
    </div>

    <a href="index.html" class="back-btn">Go Back</a>
        <script>
        let recognition;
        let isListening = false;
        let lastClickedCard = null;
        let lastExpectedChar = "";
        let recordingTimeout = null; 

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN'; 
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                if (recordingTimeout) clearTimeout(recordingTimeout);
                isListening = false;

                try {
                    // FIX: Added [0] index to correctly extract the transcript string
                    const spokenText = event.results[event.resultIndex][0].transcript.trim();
                    const targetPinyin = pinyinPro.pinyin(lastExpectedChar, { toneType: 'num' });
                    const spokenPinyin = pinyinPro.pinyin(spokenText, { toneType: 'num' });
                    const statusElement = document.getElementById('statusMessage');

                    evaluatePronunciation(lastClickedCard, spokenText, spokenPinyin, targetPinyin, lastExpectedChar, statusElement);
                } catch (error) {
                    console.error("Error processing speech result:", error);
                    const statusElement = document.getElementById('statusMessage');
                    statusElement.textContent = "Error reading speech. Try again.";
                    statusElement.style.color = "#e74c3c";
                    resetActiveCardVisuals();
                }
            };

            recognition.onerror = function(event) {
                if (recordingTimeout) clearTimeout(recordingTimeout);
                resetActiveCardVisuals();
                const statusElement = document.getElementById('statusMessage');
                statusElement.textContent = "Voice processing error or silence. Click to try again.";
                statusElement.style.color = "#e74c3c";
            };

            recognition.onend = function() {
                resetActiveCardVisuals();
            };
        } else {
            document.getElementById('statusMessage').textContent = "Error: Browser Speech Recognition not supported.";
        }

        window.onload = function() {
            const container = document.getElementById('cardContainer');
            const textInput = "老师您好"; 

            if (textInput) {
                const characters = textInput.replace(/\s+/g, '').split('');
                characters.forEach(char => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.textContent = char;
                    
                    card.addEventListener('click', () => {
                        handleCardClick(card, char);
                    });

                    container.appendChild(card);
                });
            }
        };

        function handleCardClick(card, expectedChar) {
            if (card.classList.contains('correct')) return;

            const statusElement = document.getElementById('statusMessage');

            if (isListening) {
                try {
                    if (recordingTimeout) clearTimeout(recordingTimeout);
                    recognition.abort(); 
                } catch(e) {}
            }

            resetActiveCardVisuals();

            lastClickedCard = card;
            lastExpectedChar = expectedChar;
            isListening = true;

            card.className = 'card recording'; 
            statusElement.textContent = `Listening... Say "${expectedChar}" now.`;
            statusElement.style.color = "#e67e22";

            try {
                recognition.start();

                recordingTimeout = setTimeout(() => {
                    if (isListening) {
                        try { recognition.abort(); } catch(e){}
                        card.className = 'card incorrect';
                        statusElement.textContent = "Speech timeout. No voice detected. Try again!";
                        statusElement.style.color = "#e74c3c";
                        isListening = false;
                    }
                }, 4000);
            } catch (err) {
                card.className = 'card';
                statusElement.textContent = "Engine busy. Tap card again to retry.";
                statusElement.style.color = "#e74c3c";
                isListening = false;
            }
        }

        function evaluatePronunciation(card, spokenText, spokenPinyin, targetPinyin, expectedChar, statusElement) {
            if (!card) return;
            card.classList.remove('recording');

            if (spokenPinyin === targetPinyin || spokenText.includes(expectedChar)) {
                card.className = 'card correct';
                statusElement.textContent = `Excellent! Match found ("${spokenText}" -> ${targetPinyin})`;
                statusElement.style.color = "#2ecc71";
            } else {
                card.className = 'card incorrect';
                statusElement.textContent = `Incorrect tone. Heard: "${spokenText}" (${spokenPinyin}). Try again!`;
                statusElement.style.color = "#e74c3c";
            }
        }

        function resetActiveCardVisuals() {
            isListening = false;
            if (lastClickedCard && !lastClickedCard.classList.contains('correct') && !lastClickedCard.classList.contains('incorrect')) {
                lastClickedCard.className = 'card';
            }
        }

        function simulateResult(isCorrect) {
            if (!lastClickedCard) {
                alert("Please click on a flashcard box first.");
                return;
            }
            if (lastClickedCard.classList.contains('correct')) return;

            if (recordingTimeout) clearTimeout(recordingTimeout);
            if (recognition) {
                try { recognition.abort(); } catch(e){}
            }
            
            isListening = false;
            const statusMsg = document.getElementById('statusMessage');

            if (isCorrect) {
                lastClickedCard.className = 'card correct';
                statusMsg.textContent = `[Simulated] Correct tone for "${lastExpectedChar}"!`;
                statusMsg.style.color = "#2ecc71";
            } else {
                lastClickedCard.className = 'card incorrect';
                statusMsg.textContent = `[Simulated] Incorrect tone for "${lastExpectedChar}".`;
                statusMsg.style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
