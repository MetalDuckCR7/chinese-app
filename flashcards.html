<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa Big Chin - Flash Cards</title>
    <!-- Free external engine to convert Chinese characters to Pinyin automatically -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; text-align: center; background: #fafafa; color: #333; }
        .card-container { background: white; padding: 20px; border-radius: 16px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; min-height: 400px; }
        
        /* Navigation Button Row Alignment */
        .nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; width: 100%; }
        .btn-back { background: #6c757d; color: white; padding: 8px 14px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .btn-next-page { background: #28a745; color: white; padding: 8px 14px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .btn-next-page:disabled { background: #ccc; cursor: not-allowed; }

        /* Grid layout for independent dynamic card layouts */
        .grid-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        
        /* Interactive dynamic learning flashcard designs */
        .flash-card { background: #fdfdfd; border: 3px solid #007bff; border-radius: 12px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; min-height: 120px; position: relative; }
        .flash-card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .flash-card .pinyin { font-size: 14px; color: #007bff; font-weight: bold; height: 18px; margin-bottom: 5px; }
        .flash-card .character { font-size: 40px; font-weight: bold; }
        
        /* State alterations for successfully validated targets */
        .flash-card.completed { background: #e2f0d9; border-color: #2e7d32; cursor: not-allowed; transform: none; box-shadow: none; }
        .flash-card.completed .character { color: #2e7d32; }
        .flash-card.completed .pinyin { color: #2e7d32; }
        .flash-card.recording { border-color: #ff9800; background: #fff3e0; animation: pulse 1.5s infinite; }
        
        /* Floating decorative completion badge graphic */
        .badge-check { display: none; position: absolute; top: 8px; right: 8px; font-size: 20px; color: #2e7d32; font-weight: bold; }
        .flash-card.completed .badge-check { display: block; }
        
        #deckStatus { margin: 15px 0; font-weight: bold; color: #666; font-size: 15px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="card-container">
    <div class="nav-row">
        <button class="btn-back" id="backBtn">⬅️ Back</button>
        <div style="font-weight: bold; font-size: 18px;">🎴 Flash Cards Session</div>
        <button class="btn-next-page" id="finalNextBtn" disabled>Finish ➡️</button>
    </div>
    
    <div id="deckStatus">Tap a card to start recording its pronunciation!</div>
    
    <!-- Render Container Grid for Flash Cards -->
    <div class="grid-area" id="cardsGrid"></div>
</div>
<script>
    const cardsGrid = document.getElementById('cardsGrid');
    const deckStatus = document.getElementById('deckStatus');
    const backBtn = document.getElementById('backBtn');
    const finalNextBtn = document.getElementById('finalNextBtn');

    // Fixed global syntax reference for pinyin extraction engine setup
    const { pinyin } = pinyinPro;

    // Retrieve terms passed from the home page securely
    const urlParams = new URLSearchParams(window.location.search);
    const complexPhrase = urlParams.get('words') || "老师好";

    // Split phrase into single characters and clean out spacing parameters
    let rawArray = complexPhrase.replace(/\s+/g, '').split("");
    
    // Map individual characters with their respective standalone pinyin markers
    let cardDeckData = rawArray.map(function(char) {
        return {
            character: char,
            pinyin: pinyin(char) || "",
            isDone: false
        };
    });

    // Durstenfeld Shuffle Engine to randomize configuration arrays perfectly
    let shuffleIdx = cardDeckData.length - 1;
    while (shuffleIdx > 0) {
        const randomTargetIdx = Math.floor(Math.random() * (shuffleIdx + 1));
        const temporalStorageHolder = cardDeckData[shuffleIdx];
        cardDeckData[shuffleIdx] = cardDeckData[randomTargetIdx];
        cardDeckData[randomTargetIdx] = temporalStorageHolder;
        shuffleIdx = shuffleIdx - 1;
    }

    let activeCardIndex = null;

    // Render interactive nodes directly inside flashcard canvas structure
    function renderFlashCards() {
        cardsGrid.innerHTML = "";
        let totalCompletedCount = 0;

        cardDeckData.forEach(function(cardItem, index) {
            const cardEl = document.createElement('div');
            cardEl.className = "flash-card";
            
            if (cardItem.isDone) {
                cardEl.className += " completed";
                totalCompletedCount = totalCompletedCount + 1;
            } else if (activeCardIndex === index) {
                cardEl.className += " recording";
            }

            const pinSpan = document.createElement('span');
            pinSpan.className = "pinyin";
            pinSpan.innerText = cardItem.pinyin;

            const charSpan = document.createElement('span');
            charSpan.className = "character";
            charSpan.innerText = cardItem.character;

            const badge = document.createElement('div');
            badge.className = "badge-check";
            badge.innerText = "✅";

            cardEl.appendChild(badge);
            cardEl.appendChild(pinSpan);
            cardEl.appendChild(charSpan);

            // Click listener workflow to engage vocal engine processes on uncompleted elements
            cardEl.onclick = function() {
                if (cardItem.isDone || activeCardIndex !== null) return;
                triggerCardVoiceRecognition(index);
            };

            cardsGrid.appendChild(cardEl);
        });

        // Unlock page exit controls once deck processing operations reach 100% metrics
        if (totalCompletedCount === cardDeckData.length) {
            deckStatus.innerText = "🎉 Excellent job! All cards cleared perfectly.";
            finalNextBtn.disabled = false;
        } else if (activeCardIndex === null) {
            deckStatus.innerText = "Cleared: " + totalCompletedCount + " / " + cardDeckData.length + " items. Pick another card!";
        }
    }

    // Voice evaluation workflow controller block
    function triggerCardVoiceRecognition(targetIndex) {
        activeCardIndex = targetIndex;
        renderFlashCards();
        deckStatus.innerText = "🎙️ Listening closely... Say: " + cardDeckData[targetIndex].character;

        const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
        if (!SpeechRecognition) {
            alert("Vocal metrics engines aren't fully deployed on this browser flavor. Use native Google Chrome profiles.");
            activeCardIndex = null;
            renderFlashCards();
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.interimResults = false;

        recognition.start();

        recognition.onresult = function(event) {
            const speechText = event.results.transcript || "";
            const currentTarget = cardDeckData[targetIndex];
            
            const targetPinyin = currentTarget.pinyin;
            const heardPinyin = pinyin(speechText) || "";

            // Evaluate if pronunciation string contains character glyph or maps tone phonetics
            if (speechText.includes(currentTarget.character) || (targetPinyin && heardPinyin.includes(targetPinyin))) {
                currentTarget.isDone = true;
                deckStatus.innerText = "🎯 Correct pronunciation recognized!";
            } else {
                deckStatus.innerText = "❌ That didn't match. Tap to try again!";
            }
        };

        recognition.onerror = function() {
            deckStatus.innerText = "⚠️ Microphone alert. Let's tap to restart.";
        };

        recognition.onend = function() {
            activeCardIndex = null;
            renderFlashCards();
        };
    }

    // Return safely back to the word input console screen
    backBtn.onclick = function() {
        window.location.href = "index.html";
    };

    finalNextBtn.onclick = function() {
        alert("Session completed successfully! Returning home.");
        window.location.href = "index.html";
    };

    window.addEventListener('DOMContentLoaded', renderFlashCards);
</script>
</body>
</html>
