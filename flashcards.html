<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Character Jumble - Flash Cards</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; text-align: center; background: #fafafa; color: #333; }
        .card { background: white; padding: 20px; border-radius: 16px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .instruction { margin: 5px 0 20px 0; color: #666; font-size: 15px; }
        
        /* Container for the draggable character cards */
        .cards-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; min-height: 80px; padding: 10px; background: #f0f7ff; border-radius: 8px; }
        
        /* Individual character tile styling */
        .drag-tile { background: #673ab7; color: white; font-size: 32px; font-weight: bold; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: grab; user-select: none; box-shadow: 0 3px 6px rgba(0,0,0,0.16); transition: transform 0.1s ease, background-color 0.2s; }
        .drag-tile:active { cursor: grabbing; }
        
        /* Visual style element when an item is being dragged over a spot */
        .drag-tile.drag-over { border: 2px dashed #007bff; transform: scale(1.05); background: #512da8; }
        
        .btn-back { background: #eee; color: #333; border: none; padding: 10px 14px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; float: left; margin-top: 10px; text-decoration: none; display: inline-block; }
        .button-row { display: block; width: 100%; overflow: hidden; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧩 Character Jumble Flash Cards</h2>
    <!-- Updated explicit instruction statement text -->
    <p class="instruction" style="font-weight: bold; color: #444;">
        Drag and drop the blocks to rearrange the characters into the correct sequence!
    </p>
    
    <!-- Draggable Character Workspace Grid Container -->
    <div class="cards-container" id="cardsContainer"></div>

    <!-- Interactive evaluation action controls row -->
    <div class="controls-row">
        <button class="btn-action btn-check" id="checkBtn">✅ Check Answer</button>
        <button class="btn-action btn-scramble" id="scrambleBtn">🔀 Scramble Again</button>
    </div>

    <!-- Alert message output destination container box -->
    <div class="feedback-msg" id="feedbackMsg"></div>

    <div class="button-row">
        <a href="index.html" class="btn-back">⬅️ Back to Practice</a>
    </div>
</div>

<script>
   document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('cardsContainer');
    const checkBtn = document.getElementById('checkBtn');
    const scrambleBtn = document.getElementById('scrambleBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    
    // Read the query parameters string or look up default test text variables
    const urlParams = new URLSearchParams(window.location.search);
    const originalPhrase = (urlParams.get('words') || "老师好").trim();
    
    if (!originalPhrase) {
        container.innerText = "No phrase provided. Please return to the homepage.";
        return;
    }

    let draggedElement = null;

    // Helper rendering function to break items apart, shuffle them, and build individual tiles
    function renderScrambledTiles() {
        container.innerHTML = "";
        feedbackMsg.style.display = "none"; // Clear out legacy feedback status alerts
        
        // Split the target phrase into single characters
        let charArray = originalPhrase.split('');

        // Fisher-Yates random shuffle algorithm implementation framework logic
        // Loops continuously to guarantee characters are genuinely out of order
        let shuffleAttempts = 0;
        do {
            for (let i = charArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [charArray[i], charArray[j]] = [charArray[j], charArray[i]];
            }
            shuffleAttempts++;
        } while (charArray.join('') === originalPhrase && charArray.length > 1 && shuffleAttempts < 10);

        // Build up individual DOM nodes out of the randomized array grid configuration properties
        charArray.forEach((char) => {
            if(char.trim() === "") return;

            const tile = document.createElement('div');
            tile.className = 'drag-tile';
            tile.draggable = true;
            tile.innerText = char;
            
            // Register native drag/drop operation handlers
            tile.addEventListener('dragstart', handleDragStart);
            tile.addEventListener('dragover', handleDragOver);
            tile.addEventListener('dragenter', handleDragEnter);
            tile.addEventListener('dragleave', handleDragLeave);
            tile.addEventListener('drop', handleDrop);
            tile.addEventListener('dragend', handleDragEnd);
            
            container.appendChild(tile);
        });
    }

    // Drag-and-drop structural operational flow mechanics functions
    function handleDragStart(e) {
        draggedElement = this;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', this.innerText);
        this.style.opacity = '0.4';
    }

    function handleDragOver(e) {
        if (e.preventDefault) e.preventDefault();
        return false;
    }

    function handleDragEnter(e) {
        if (this !== draggedElement) this.classList.add('drag-over');
    }

    function handleDragLeave(e) {
        this.classList.remove('drag-over');
    }

    function handleDrop(e) {
        e.stopPropagation();
        e.preventDefault();
        this.classList.remove('drag-over');
        
        if (draggedElement !== this) {
            const allTiles = Array.from(container.children);
            const draggedIndex = allTiles.indexOf(draggedElement);
            const targetIndex = allTiles.indexOf(this);
            
            if (draggedIndex < targetIndex) {
                container.insertBefore(draggedElement, this.nextSibling);
            } else {
                container.insertBefore(draggedElement, this);
            }
        }
        return false;
    }

    function handleDragEnd(e) {
        this.style.opacity = '1.0';
        const tiles = container.querySelectorAll('.drag-tile');
        tiles.forEach(tile => tile.classList.remove('drag-over'));
    }

    // Interactive button validation logic controls
    checkBtn.addEventListener('click', () => {
        // Read down the elements in their current user-rearranged sequence
        const currentTiles = container.querySelectorAll('.drag-tile');
        let currentSequence = "";
        currentTiles.forEach(tile => currentSequence += tile.innerText);

        feedbackMsg.style.display = "block";
        
        // Assert true string equivalence matching against the original keyword sequence
        if (currentSequence === originalPhrase) {
            feedbackMsg.className = "feedback-msg correct";
            feedbackMsg.innerText = "Correct! 🎉 Excellent job.";
        } else {
            feedbackMsg.className = "feedback-msg wrong";
            feedbackMsg.innerText = "Wrong, try again! ❌";
        }
    });

    // Re-scramble button reset registration trigger routing loop
    scrambleBtn.addEventListener('click', renderScrambledTiles);

    // Run original random generation sequence instantly upon document initialization
    renderScrambledTiles();
});

</script>
</body>
</html>
