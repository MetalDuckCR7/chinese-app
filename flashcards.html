<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Flashcards</title>
    <!-- 1. Import pinyin-pro library via CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .status-msg {
            margin-bottom: 24px;
            font-size: 1rem;
            color: #7f8c8d;
            font-weight: bold;
            min-height: 24px;
            text-align: center;
        }

        .flashcard-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            aspect-ratio: 3 / 4; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #2c3e50;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            cursor: pointer;
        }

        /* Active recording visual style */
        .card.recording {
            border-color: #e67e22;
            animation: pulse 1.5s infinite;
            cursor: wait;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(230, 126, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); }
        }

        /* Incorrect intonation visual style */
        .card.incorrect {
            color: #e74c3c !important;
            border-color: #e74c3c;
        }

        /* Correct intonation visual style */
        .card.correct {
            color: #2ecc71 !important;
            border-color: #2ecc71;
            background-color: #fafffa;
            pointer-events: none; /* Disables clicking again */
            transform: none !important;
            box-shadow: none;
        }

        @media (min-width: 768px) {
            h1 { font-size: 2.2rem; }
            .flashcard-container {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 20px;
                max-width: 900px;
            }
            .card { font-size: 3.5rem; }
        }

        .no-data {
            grid-column: span 3;
            text-align: center;
            font-size: 1.1rem;
            color: #7f8c8d;
        }

        .back-btn {
            margin-top: 32px;
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <h1>Study Deck</h1>
    <div class="status-msg" id="statusMessage">Tap a card and speak the character clearly.</div>

    <div class="flashcard-container" id="cardContainer">
        <!-- Cards injected dynamically -->
    </div>

    <a href="index.html" class="back-btn">Go Back</a>

    <script>
        let recognition;
        let isListening = false;

        // Initialize Browser Speech Recognition Engine
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN'; // Force Chinese Language Input
            recognition.continuous = false;
            recognition.interimResults = false;
        } else {
            document.getElementById('statusMessage').textContent = "Error: Browser does not support Speech Recognition.";
        }

        function getQueryParams() {
            const params = {};
            const search = window.location.search.substring(1);
            if (search) {
                const pairs = search.split("&");
                for (let i = 0; i < pairs.length; i++) {
                    const pair = pairs[i].split("=");
                    params[decodeURIComponent(pair)] = decodeURIComponent(pair || '');
                }
            }
            return params;
        }

        window.onload = function() {
            const params = getQueryParams();
            const container = document.getElementById('cardContainer');
            const statusMsg = document.getElementById('statusMessage');
            
            // ==========================================
            // TESTING MODIFICATION: HARDCODED CHARACTERS
            // Replace the line below with: const textInput = params['characters'];
            // ==========================================
            const textInput = "老师您好"; 
            // ==========================================

            if (textInput && textInput.trim() !== "") {
                const characters = textInput.replace(/\s+/g, '').split('');

                characters.forEach(char => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.textContent = char;
                    
                    card.addEventListener('click', () => {
                        handleCardClick(card, char, statusMsg);
                    });

                    container.appendChild(card);
                });
            } else {
                container.innerHTML = '<p class="no-data">No characters received.</p>';
            }
        };

        function handleCardClick(card, expectedChar, statusElement) {
            if (isListening || card.classList.contains('correct') || !recognition) return;

            isListening = true;
            card.classList.add('recording');
            statusElement.textContent = `Listening... Say "${expectedChar}" now.`;
            statusElement.style.color = "#e67e22";

          recognition.start();

            recognition.onresult = function(event) {
                // FIXED CRITICAL SYNTAX ERROR HERE
                const spokenText = event.results[0][0].transcript.trim();
                
                const targetPinyin = pinyinPro.pinyin(expectedChar, { toneType: 'num' });
                const spokenPinyin = pinyinPro.pinyin(spokenText, { toneType: 'num' });

                evaluatePronunciation(card, spokenText, spokenPinyin, targetPinyin, expectedChar, statusElement);
            };

            recognition.onerror = function(event) {
                card.className = 'card';
                statusElement.textContent = "Could not capture voice. Try the simulation test buttons above.";
                statusElement.style.color = "#e74c3c";
                isListening = false;
            };

            recognition.onend = function() {
                isListening = false;
            };
        }

        function evaluatePronunciation(card, spokenText, spokenPinyin, targetPinyin, expectedChar, statusElement) {
            card.classList.remove('recording');

            if (spokenPinyin === targetPinyin || spokenText.includes(expectedChar)) {
                card.classList.remove('incorrect');
                card.classList.add('correct');
                statusElement.textContent = `Excellent! Match found ("${spokenText}" -> ${targetPinyin})`;
                statusElement.style.color = "#2ecc71";
            } else {
                card.classList.add('incorrect');
                statusElement.textContent = `Incorrect tone. Heard: "${spokenText}" (${spokenPinyin}). Try again!`;
                statusElement.style.color = "#e74c3c";
            }
        }

        // Helper function to test layouts instantly without microphone frustration
        function simulateResult(isCorrect) {
            if (!lastClickedCard) {
                alert("Please click on a flashcard box first to select it before triggering a simulation.");
                return;
            }
            if (lastClickedCard.classList.contains('correct')) return;

            const statusMsg = document.getElementById('statusMessage');
            if (recognition) recognition.abort(); // Cancel real listener if active
            lastClickedCard.classList.remove('recording');
            isListening = false;

            if (isCorrect) {
                lastClickedCard.classList.remove('incorrect');
                lastClickedCard.classList.add('correct');
                statusMsg.textContent = `[Simulated] Correct tone for "${lastExpectedChar}"!`;
                statusMsg.style.color = "#2ecc71";
            } else {
                lastClickedCard.classList.add('incorrect');
                statusMsg.textContent = `[Simulated] Incorrect tone for "${lastExpectedChar}". Card turned Red.`;
                statusMsg.style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
