<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahasa Melayu Lesson - Papa Big Chin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        
        /* Grid Layout: Symmetrical horizontal level alignments */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 20px;
        }
        
        .phrase-row {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 46px;
        }
        .phrase-number {
            font-weight: bold;
            color: #34495e;
            width: 20px;
        }
        
        /* Single framed container on the right side - Orange Theme */
        .mix-match-single-box {
            background-color: #fdf6ee;
            border: 2px dashed #e67e22;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            box-sizing: border-box;
        }
        .mix-match-single-box::before {
            content: "Mix Match";
            position: absolute;
            top: -12px;
            left: 15px;
            background-color: #e67e22;
            color: white;
            padding: 2px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .full-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
            background-color: white;
            height: 46px;
        }
        .full-input:focus {
            border-color: #3498db;
            outline: none;
        }
        
        /* Orientation Lock Blocker Overlay Styles */
        .orientation-blocker {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .blocker-content {
            max-width: 400px;
        }
        .blocker-icon {
            font-size: 3.5rem;
            display: inline-block;
            margin-bottom: 15px;
            animation: rotateIcon 2s infinite ease-in-out;
        }
        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }
        @media screen and (max-width: 767px) and (orientation: portrait) {
            .orientation-blocker {
                display: flex;
            }
            body {
                overflow: hidden;
            }
        }
        
        /* Main Navigation Action Controls Layout Panel Grid */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .nav-btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            width: 100%;
        }
        .primary-btn {
            background-color: #2ecc71;
            color: white;
        }
        .primary-btn:hover {
            background-color: #27ae60;
        }
        .mix-match-action-btn {
            background-color: #e67e22;
            color: white;
        }
        .mix-match-action-btn:hover {
            background-color: #d35400;
        }
        .back-btn {
            background-color: #95a5a6;
            color: white;
            grid-column: span 2;
            margin-top: -5px;
        }
        .back-btn:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    <!-- Orientation Lock Blocker Overlay -->
    <div class="orientation-blocker">
        <div class="blocker-content">
            <span class="blocker-icon">🔄</span>
            <h2>Sila Putar Peranti Anda</h2>
            <p>Aktiviti ini paling baik dialami dalam Mod Landskap. Sila pusingkan telefon anda ke sisi untuk membuka kunci pelajaran!</p>
        </div>
    </div>

    <div class="container">
        <h1>Menu Bahasa Melayu</h1>
        <p class="subtitle">Suaikan ayat latihan anda di bawah, kemudian pilih aktiviti pembelajaran!</p>
        
        <!-- Primary Grid Layout for Input Rows -->
        <div class="grid-layout">
            <!-- Left Column: Custom BM Phrases -->
            <div class="left-column">
                <div class="phrase-row">
                    <span class="phrase-number">1:</span>
                    <input type="text" id="phrase1" class="full-input" value="Apa khabar?">
                </div>
                <div class="phrase-row">
                    <span class="phrase-number">2:</span>
                    <input type="text" id="phrase2" class="full-input" value="Terima kasih.">
                </div>
                <div class="phrase-row">
                    <span class="phrase-number">3:</span>
                    <input type="text" id="phrase3" class="full-input" value="Saya suka belajar.">
                </div>
                <div class="phrase-row">
                    <span class="phrase-number">4:</span>
                    <input type="text" id="phrase4" class="full-input" value="Cuaca hari ini sangat bagus.">
                </div>
                <div class="phrase-row">
                    <span class="phrase-number">5:</span>
                    <input type="text" id="phrase5" class="full-input" value="Selamat tinggal.">
                </div>
            </div>

            <!-- Right Column: Single Labeled Mix Match Box containing English translations -->
            <div class="mix-match-single-box">
                <input type="text" id="match1" class="full-input" value="How are you?">
                <input type="text" id="match2" class="full-input" value="Thank you.">
                <input type="text" id="match3" class="full-input" value="I like studying.">
                <input type="text" id="match4" class="full-input" value="The weather is nice today.">
                <input type="text" id="match5" class="full-input" value="Goodbye.">
            </div>
        </div>

        <!-- Dynamic Action Navigation Control Panel Buttons -->
        <div class="button-grid">
            <button onclick="navigateTo('bm-rearrange.html')" class="nav-btn primary-btn">Rearrange</button>
            <button onclick="navigateTo('bm-mix-match.html')" class="nav-btn mix-match-action-btn">Mix and Match Game ➔</button>
            <button onclick="navigateTo('index.html')" class="nav-btn back-btn">Back to Main Menu</button>
        </div>
    </div>

    <script>
        // Load saved entries specifically from separate Malay keys so Chinese data isn't affected
        window.addEventListener('DOMContentLoaded', () => {
            const savedPhrases = JSON.parse(localStorage.getItem('bmPhrases'));
            const savedMatches = JSON.parse(localStorage.getItem('bmMatches'));
            
            if (savedPhrases && savedPhrases.length === 5) {
                for (let i = 0; i < 5; i++) {
                    document.getElementById('phrase' + (i + 1)).value = savedPhrases[i];
                }
            }
            
            if (savedMatches && savedMatches.length === 5) {
                for (let i = 0; i < 5; i++) {
                    document.getElementById('match' + (i + 1)).value = savedMatches[i];
                }
            }
        });

        // Store configuration parameters and move screen views
        function navigateTo(targetPage) {
            const phrases = [
                document.getElementById('phrase1').value,
                document.getElementById('phrase2').value,
                document.getElementById('phrase3').value,
                document.getElementById('phrase4').value,
                document.getElementById('phrase5').value
            ];

            const matches = [
                document.getElementById('match1').value,
                document.getElementById('match2').value,
                document.getElementById('match3').value,
                document.getElementById('match4').value,
                document.getElementById('match5').value
            ];

            localStorage.setItem('bmPhrases', JSON.stringify(phrases));
            localStorage.setItem('bmMatches', JSON.stringify(matches));
            
            window.location.href = targetPage;
        }
    </script>

</body>
</html>
